- name: rom_async
  description: ''
  sourceCode: >
    # 0xCB equ 18ibits

    : cold   x31A5. a! @  @b .. -if

    : ser-exec ( x - d)   18ibits drop >r 18ibits drop a! 18ibits

    : ser-copy ( xnx-d)   drop >r zif ;  then begin 18ibits drop !+ next ;  then drop avail alit >r >r ;

    : wait ( x-1/1)   begin . drop @b -until  . drop ;

    : sync ( x-3/2-d)   dup dup wait  xor inv >r begin @b . -if . drop *next await ;  then . drop r> inv 2/ ;

    : start ( dw-4/2-dw,io) dup wait over dup 2/ . + >r

    : delay ( -1/1-io) begin @b . -if then . drop next @b ;

    ( 18ibits ( x-4/6-dwx) sync sync dup start ( 2bits) leap leap

    : byte   then drop start leap

    : 4bits   then leap

    : 2bits   then then leap

    : 1bit ( nw,io - nw,io) then >r 2/ r> over xor x20000. and xor over >r delay ;
- name: rom_basic
  description: ''
  sourceCode: >-
    macro rom_relay

    macro rom_warm

    # 0xB0 org

    macro rom_mul17

    macro rom_muldot

    macro rom_filter

    macro rom_interp

    macro rom_triangle

    macro rom_divide

    macro rom_poly
- name: rom_bitsy
  description: ''
  sourceCode: >-
    # 0xAA org

    : rp-- ( a-a') -1 . + ;

    : bs@ : 'else ( a-w)
      @p+ !b !b . @p+ x@
      @p+ !b @b ; . . . !p+
    : rp@ ( ri-ri) over rp--

    : pshbs ( w-) @p+ !b !b ; @p+ pshw

    : 'r@ ( ri-ri) over rp--

    : @w ( a-) bs@ pshbs ;

    : rfrom ( ri-r'i) over rp-- over over @w ;

    : popbs ( -w) @p+ !b @b ; !p+ pops

    : pshr ( aw-a) @p+ !b !b dup @p+ . . @p+
      !b @p+ !b . x!
    : rp++ : ip++ ( a-a') 1 . + ;

    : tor ( ri-r'i) >r popbs pshr r> ;

    : rp! ( i-ri) >r popbs rp++ r> ;

    : 'con ( ra-r'i) bs@

    : 'var ( ra-r'i) dup pshbs

    : 'exit ( rx-r'i) drop rp-- dup bs@ ;

    begin dup 2* -if drop !b ahead [ swap ] then drop >r ;'

    : bitsy then dup bs@ >r ip++

    : xxt r> -until >r pshr r> bitsy ;

    : 'ex ( xt-) popbs >r xxt ;

    : 'lit ( -w) dup bs@ >r ip++ r> pshbs ;

    : 'if ( f-) popbs if drop ip++ ; then drop 'else ;

    : start right a! left b! -32 0 bitsy ;
- name: rom_dac
  description: ''
  sourceCode: >-
    : -dac ( legacy entry name ...)

    : dac27 ( m c p a w - m c p) dup >r >r over r> inv . +  >r >r  x155. r> over xor a
      begin unext !b . begin unext !b !b ;
- name: rom_divide
  description: ''
  sourceCode: >-
    +cy

    : clc ( -2-) dup dup xor dup . + drop ;

    : --u/mod ( hld-rq) clc

    : -u/mod ( hld-ra) a! 17. >r
      begin begin dup . + . >r dup . + dup a . + -if drop r> *next dup . + ;
      then over xor xor . r> next dup . + ;
    -cy
- name: rom_filter
  description: ''
  sourceCode: ": taps ( y x c - y' x') r> a! >r begin @+ @ >r a >r *.17 r> a! >r !+ r> . + r> next @ a! ;"
- name: rom_interp
  description: ''
  sourceCode: >-
    : interp ( ims-v)
      dup >r >r over begin 2/ unext a! and >r @+ dup @+ inv . + inv r> a! dup dup xor
      begin +* unext >r drop r> . + ;
- name: rom_mul17
  description: ''
  sourceCode: >-
    : *.17 ( a b - a a*b)
      a! 16. >r dup dup xor begin +* unext inv +* a -if drop inv 2* ; then drop 2* inv ;
- name: rom_muldot
  description: ''
  sourceCode: ': *. ( f1 f2 - f1 f1*f2) *.17 a 2* -if drop inv 2* inv ; then drop 2* ;'
- name: rom_poly
  description: ''
  sourceCode: >-
    # 0xAA org

    : poly ( xn-xy) r> a! >r @+ a begin >r *. r> a! @+ + a next >r ;
- name: rom_relay
  description: ''
  sourceCode: >-
    # 0xA1 org

    : relay ( a) r> a! @+ >r @+
      zif drop ahead [ swap ] then r> over >r @p a relay !b !b !b
      begin @+ !b unext
    : done then a >r a! ;
- name: rom_serdes
  description: ''
  sourceCode: >
    macro rom_relay

    macro rom_warm

    : cold x3141. a! x3FFFE. dup !  rdlu cold ;

    # 0xB0 org

    macro rom_mul17

    macro rom_muldot

    macro rom_filter

    macro rom_interp

    macro rom_triangle

    macro rom_divide
- name: rom_shift
  description: ''
  sourceCode: >-
    : lsh ( w n-1 - w') for 2* unext ;

    : rsh ( w n-1 - w') for 2/ unext ;
- name: rom_spi
  description: ''
  sourceCode: >+
    # 0x2A constant ---

    # 0x2B constant --+

    # 0x3A constant +--

    # 0x3B constant +-+

    # 0x2F constant -++

    # 0xC2 org

    : 8obits ( dw-dw') 7. for  ( obit) leap 2* *next ;

    : ibit ( dw-dw') @b . -if  drop inv 2* ;  then drop 2* inv ;

    : half ( dwc-dw) !b over for . . unext ;

    : select ( dw-dw) -++ half --+ half ;

    : obit ( dw-dw) then  -if +-- half +-+ half ; then

    : rbit ( dw-dw) --- half --+ half ;

    : 18ibits ( d-dw) dup 17. >r

    : ibits   begin rbit ibit inv next ;

    : u2/ ( n - n) 2/ x1FFFF. and ;

    # 497 constant spispeed

    # 0xC00 constant spicmd

    # 0 constant spiadr

    # 0xAA org

    : cold @b inv ..  avail -until  spispeed spiadr >r spicmd

    : spi-boot ( d ah - d x) select  8obits 8obits drop r> . 8obits 8obits

    : spi-exec ( dx-dx) drop 18ibits x1E000. . +  # rdl- -until >r 18ibits a! 18ibits

    : spi-copy ( dn-dx) >r zif ; then begin 18ibits !+ next  dup ;


- name: rom_spi_boot
  description: ''
  sourceCode: >
    macro rom_relay

    macro rom_warm

    macro rom_spi
- name: rom_stack
  description: ''
  sourceCode: >-
    # 0x3C equ xa@

    # 0x3E equ xa!

    # 0xAA org

    : 'c@ : '@ : x@ ( a-w) za@ @b ;

    : sp++ : char+ : cell+ : 1+ ( w-w') 1 . + ;

    : popt ( p-xp't) dup sp++ over x@ ;

    : sp-- : char- : cell- : 1- -1 . + ;

    : psht ( pt-p') >r sp-- r> over

    : x! ( wa-) xa! !b ;

    : 'c! : '! ( pwa-p'st) x!

    : popts ( p-p'st) popt

    : pops ( pt-p'st) >r popt r> ;

    : pshs ( pst-p't) >r psht r> ;

    : page@ ( pst-p'tw) @p+ !b @b . dup !p+ ;

    : pshw ( pstw-p'tw) >r pshs r> ;

    : page! ( ptw-p'tw) @p+ !b !b . drop !p+ ;

    pops ;

    : sp@ ( -a) pshs psht dup pops ;

    : sp! ( a-) pshs popts ;

    : 'drop ( w-) drop pops ;

    : 'over ( ww-www) over pshw ;

    : 'dup ( w-ww) dup pshw ;

    : 'swap ( ab-ba) over >r >r drop r> r> ;

    : '2/ ( w-w) 2/ ; : '2* ( w-w) 2* ;

    : um+ ( uu-uc) over xor -if over xor . + -if

    : 'nc ( -0) dup dup xor ;

    : 'cy ( -1) then 1 ; then over xor -if + 'cy ; then + 'nc ;

    : zless ( n-f) -if dup xor inv ; then dup xor ;

    : 'or ( ww-w) over inv and

    : 'xor ( ww-w) xor pops ;

    : 'and ( ww-w) and pops ;

    : 'negate ( w-w) 1- ;

    : 'invert ( w-w') begin inv ;

    : 'zeq ( w-f) until dup xor ;

    : '+ ( pww-p'sw') + pops ;

    : swap- inv . + pops ;

    : start right b! 0 dup dup --l- ;
- name: rom_sync
  description: ''
  sourceCode: >
    # 0xBE equ sget

    : cold   x31A5. a! @ @b . .
      -if avail [ 0x3.FC00 + ] lit  dup >r dup begin drop @b . 
      -if ( rising) *next [ swap ] then avail lit >r  drop >r ; then
    : ser-exec ( x - x)   sget >r  sget a!  sget

    : ser-copy ( n)   >r zif ;  then begin sget !+ next ;

    ( sget) ( -4/3-w)   dup leap leap

    : 6in   then then leap leap

    : 2in   then then  2* 2*  dup
      begin . drop @b . inv -until  inv 2. and dup begin . drop @b . . -until  2. and 2/ xor xor ;
- name: rom_sync_boot
  description: ''
  sourceCode: >
    macro rom_relay

    macro rom_warm

    macro rom_sync

    macro rom_mul17

    macro rom_filter

    macro rom_triangle
- name: rom_triangle
  description: ''
  sourceCode: ': triangle ( ang*4) x1.0000 over -if drop . + ; then drop inv . + inv ;'
- name: rom_warm
  description: ''
  sourceCode: >-
    # 0xA9 org

    : warm await ;
- name: rom_wire1
  description: ''
  sourceCode: >-
    # 0x9E org

    : rcv ( s-sn) a >r dup dup a! 17. for begin

    : bit @ drop @b -if drop inv 2* inv *next r> a! ; then drop 2* next r> a! ;

    # 0xAA org

    : cold left center a! . io b! dup dup xB7. dup >r >r 16. >r @ drop @b # await -until
      drop a! . bit ;
    : fwd-b7 >r rcv a! rcv >r zif ; then begin rcv !+ next ;
- name: rom_wire1_boot
  description: ''
  sourceCode: >
    macro rom_warm

    macro rom_wire1

    macro rom_triangle

    macro rom_mul17

    macro rom_muldot

    macro rom_divide
