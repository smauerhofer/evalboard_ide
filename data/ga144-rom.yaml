- name: rom_bitsy
  description: ''
  sourceCode: >
    # 106 import

    macro rom_warm

    # 0xAA org

    : rp-- ( a-a') -1 . + ;

    : bs@ : 'else ( a-w)
      A[ @p+ x@ ]] lit !b !b . A[ . . . !p+ ]] lit !b @b ;
    : rp@ ( ri-ri) over rp--

    : pshbs ( w-) A[ @p+ pshw ]] lit !b !b ;

    : 'r@ ( ri-ri) over rp--

    : @w ( a-) bs@ pshbs ;

    : rfrom ( ri-r'i) over rp-- over over @w ;

    : popbs ( -w) A[ !p+ pops ]] lit !b @b ;

    : pshr ( aw-a) A[ @p+ . . @p+ ]] lit !b !b dup !b A[ x! ]] lit !b .

    : rp++ : ip++ ( a-a') 1 . + ;

    : tor ( ri-r'i) >r popbs pshr r> ;

    : rp! ( i-ri) >r popbs rp++ r> ;

    : 'con ( ra-r'i) bs@

    : 'var ( ra-r'i) dup pshbs

    : 'exit ( rx-r'i) drop rp-- dup bs@ ;

    begin dup 2* -if drop !b ahead [ swap ] then drop >r ex

    : bitsy then dup bs@ >r ip++

    : xxt r> -until >r pshr r> bitsy ;

    : 'ex ( xt-) popbs >r xxt ;

    : 'lit ( -w) dup bs@ >r ip++ r> pshbs ;

    : 'if ( f-) popbs if drop ip++ ; then drop 'else ;
- name: rom_dac
  description: ''
  sourceCode: >-
    : -dac ( legacy entry name ...)

    : dac27 ( m c p a w - m c p) dup >r >r over r> inv . +  >r >r  x155. r> over xor a
      begin unext !b . begin unext !b !b ;
- name: rom_data
  description: ''
  sourceCode: >-
    macro rom_warm

    # 0xAA org

    : db@ ( -w) @ ;

    : db! ( w-) 0x15555 !b !

    : inpt 0x14555 !b ;
- name: rom_divide
  description: ''
  sourceCode: >-
    +cy

    : clc ( -2-) dup dup xor dup . + drop ;

    : --u/mod ( hld-rq) clc

    : -u/mod ( hld-ra) a! 17. >r
      begin begin dup . + . >r dup . + dup a . + -if drop r> *next dup . + ;
      then over xor xor . r> next dup . + ;
    -cy
- name: rom_filter
  description: ''
  sourceCode: ": taps ( y x c - y' x') r> a! >r begin @+ @ >r a >r *.17 r> a! >r !+ r> . + r> next @ a! ;"
- name: rom_idle
  description: ''
  sourceCode: >
    macro rom_warm


    # 0 equ nooop

    # 0xAA org

    : noop ( ) @p+ ! ; nooop

    : cmd ( c-) 0x5a48 ! ! ;

    : idle ( m-m) @p+ ! .. nooop 0x8003 cmd noop
      120 for @p+ ! .. nooop
        begin @b and if @ .. @ ! ! *next idle ;
        then drop
      next @p+ ! .. nooop idle ;
    : init ( m-m)
      4761 for noop next
      noop 0x10400 cmd noop
      0x8001 cmd noop noop
      0x8002 cmd noop noop
      0x21 cmd noop noop
      0x4000 cmd noop idle ;
- name: rom_interp
  description: ''
  sourceCode: >-
    : interp ( ims-v)
      dup >r >r over begin 2/ unext a! and >r @+ dup @+ inv . + inv r> a! dup dup xor
      begin +* unext >r drop r> . + ;
- name: rom_mul17
  description: ''
  sourceCode: >-
    : *.17 ( a b - a a*b)
      a! 16. >r dup dup xor begin +* unext inv +* a -if drop inv 2* ; then drop 2* inv ;
- name: rom_muldot
  description: ''
  sourceCode: ': *. ( f1 f2 - f1 f1*f2) *.17 a 2* -if drop inv 2* inv ; then drop 2* ;'
- name: rom_poly
  description: ''
  sourceCode: >-
    # 0xAA org

    : poly ( xn-xy) r> a! >r @+ a begin >r *. r> a! @+ + a next >r ;
- name: rom_relay
  description: ''
  sourceCode: >-
    # 0xA1 org

    : relay ( a) r> a! @+ >r @+
      zif drop ahead [ swap ] then r> over >r @p a relay !b !b !b
      begin @+ !b unext
    : done then a >r a! ;
- name: rom_serdes
  description: ''
  sourceCode: >
    macro rom_relay

    macro rom_warm

    : cold x3141. a! x3FFFE. dup !  rdlu cold ;

    # 0xB0 org

    macro rom_mul17

    macro rom_muldot

    macro rom_filter

    macro rom_interp

    macro rom_triangle

    macro rom_divide
- name: rom_shift
  description: ''
  sourceCode: >-
    : lsh ( w n-1 - w') for 2* unext ;

    : rsh ( w n-1 - w') for 2/ unext ;
- name: rom_spi
  description: ''
  sourceCode: >+
    # 0x2A constant ---

    # 0x2B constant --+

    # 0x3A constant +--

    # 0x3B constant +-+

    # 0x2F constant -++

    # 0xC2 org

    : 8obits ( dw-dw') 7. for  ( obit) leap 2* *next ;

    : ibit ( dw-dw') @b . -if  drop inv 2* ;  then drop 2* inv ;

    : half ( dwc-dw) !b over for . . unext ;

    : select ( dw-dw) -++ half --+ half ;

    : obit ( dw-dw) then  -if +-- half +-+ half ; then

    : rbit ( dw-dw) --- half --+ half ;

    : 18ibits ( d-dw) dup 17. >r

    : ibits   begin rbit ibit inv next ;

    : u2/ ( n - n) 2/ x1FFFF. and ;

    # 497 constant spispeed

    # 0xC00 constant spicmd

    # 0 constant spiadr

    # 0xAA org

    : cold @b inv ..  avail -until  spispeed spiadr >r spicmd

