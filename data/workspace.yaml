        fpush 7                   ; 28 expect 7FC0 0000


        fmove 7 4

        fmin 7 4

        fpush 7                   ; 29 expect 7FC0 0000


        fmove 7 4

        fmin 7 5

        fpush 7                   ; 30 expect 7FC0 0000



        // ------------------------------------------------------------

        // lhs = sNaN

