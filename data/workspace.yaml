          2/ 2/ 2/ 2/ 2/ 2/ 2/
          0xff and

          // Keep raw exponent for deciding whether the
          // implicit mantissa bit must be inserted.

          dup >r

          // Output effective exponent:
          //
          // normal       raw exponent
          // subnormal    1
          // zero         0
          // inf/nan      ff

          if
            !
          else
            drop
            f1/frac?
            if
              drop 1
            else
              dup xor
            then
            !
          then

