    - name: FP fmul regression test 1
      source: >
        // CVM2 binary32 regression: fmul

        // Assumes: fmul d s => F[d] = F[d] * F[s]

        // Each case loads A into F0 and B into F1, copies F0 to F7,

        // performs fmul 7 1, then fpush 7 emits the result.

        // Reference: IEEE-754 binary32 round-to-nearest-even.

        // Any NaN result is expected as canonical 7FC0:0000.

        //

        // Coverage:

        //   324 cases: complete 18 x 18 argument-class matrix

        //   76 cases: directed normal/subnormal, overflow/underflow,

        //             normalization, RNE ties and mantissa stress

        //   400 cases total


        // case 000: matrix +0 fmul +0

        // A=0000:0000  B=0000:0000  expected=0000:0000

        pushlit 0x0000

        pushlit 0x0000

        fpop 0

        pushlit 0x0000

        pushlit 0x0000

        fpop 1

        fmove 7 0

        fmul 7 1

        fpush 7


        // case 001: matrix +0 fmul -0

        // A=0000:0000  B=8000:0000  expected=8000:0000

        pushlit 0x0000

        pushlit 0x0000

        fpop 0

        pushlit 0x8000

        pushlit 0x0000

        fpop 1

        fmove 7 0

        fmul 7 1

        fpush 7


        // case 002: matrix +0 fmul +minsub

        // A=0000:0000  B=0000:0001  expected=0000:0000

        pushlit 0x0000

        pushlit 0x0000

        fpop 0

        pushlit 0x0000

        pushlit 0x0001

        fpop 1

        fmove 7 0

        fmul 7 1

        fpush 7


