        // First operation uses effective mantissa subtraction.

        // Later operations require effective mantissa addition.

        //

        //  1-2 = -1

        // -1-2 = -3

        // -3-2 = -5

        // -5-2 = -7

        // -7-2 = -9

        // ============================================================


        pushlit 0x3F80            ; +1.0

        pushlit 0x0000

        fpop 0


        pushlit 0x4000            ; +2.0

        pushlit 0x0000

        fpop 1


        fsub 0 1

        fpush 0                   ; expect BF80 0000  -1.0


        fsub 0 1

        fpush 0                   ; expect C040 0000  -3.0


        fsub 0 1

        fpush 0                   ; expect C0A0 0000  -5.0


        fsub 0 1

        fpush 0                   ; expect C0E0 0000  -7.0


        fsub 0 1

        fpush 0                   ; expect C110 0000  -9.0




        // ============================================================

        // TEST 5

        // Mixed signs

        //

        // +1 + (-2) = -1

        // -1 + (+2) = +1

        // +1 - (-2) = +3

        // +3 + (-2) = +1

        // +1 - (+2) = -1

        // ============================================================


        pushlit 0x3F80            ; +1.0

        pushlit 0x0000

        fpop 0


        pushlit 0xC000            ; -2.0

        pushlit 0x0000

        fpop 1


        pushlit 0x4000            ; +2.0

        pushlit 0x0000

        fpop 2


        fadd 0 1

        fpush 0                   ; expect BF80 0000  -1.0


        fadd 0 2

        fpush 0                   ; expect 3F80 0000  +1.0


        fsub 0 1

        fpush 0                   ; expect 4040 0000  +3.0


        fadd 0 1

        fpush 0                   ; expect 3F80 0000  +1.0


        fsub 0 2

        fpush 0                   ; expect BF80 0000  -1.0




        // ============================================================

        // TEST 6

        // Exact cancellation

        //

        // Under round-to-nearest-even all results must be +0.

        //

        // +1 + (-1) = +0

        // -1 + (+1) = +0

        // +1 - (+1) = +0

        // -1 - (-1) = +0

        // ============================================================


        // fr1 = +1.0


        pushlit 0x3F80

        pushlit 0x0000

        fpop 1


        // fr2 = -1.0


        pushlit 0xBF80

        pushlit 0x0000

        fpop 2



        // +1 + (-1)


        pushlit 0x3F80

        pushlit 0x0000

        fpop 0


        fadd 0 2

        fpush 0                   ; expect 0000 0000



        // -1 + (+1)


        pushlit 0xBF80

        pushlit 0x0000

        fpop 0


        fadd 0 1

        fpush 0                   ; expect 0000 0000



        // +1 - (+1)


        pushlit 0x3F80

        pushlit 0x0000

        fpop 0


        fsub 0 1

        fpush 0                   ; expect 0000 0000



        // -1 - (-1)


        pushlit 0xBF80

        pushlit 0x0000

        fpop 0


        fsub 0 2

        fpush 0                   ; expect 0000 0000




