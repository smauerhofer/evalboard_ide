        ( CVM2 node 607. SRAM simulator using the PC )

        # 0 org

        # down /b

        # up /a // confine the access to node 507 only for now

        entry main

        : main
          @
          // we have something to do
          -if
            !b @ -if
              // ( ~p ~a )  write word
              !b @ !b main ;
            then
            // ( ~n p ) compare and exchange
            !b @ !b @ !b @b ! main ;
          then
          @ -if
            // ( x ~op )
            inv if
              // stimuli
              a @ a! dup ! a!
            else
              // set mask
              @ a!
            then
            !b @ !b main ;
          then
          // ( p a ) read
          >r !b r> !b @b !
          main ;
