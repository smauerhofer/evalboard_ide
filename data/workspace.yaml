      sourceCode: >
        ( CVM2 node 601. VM 32 bit floatingpoint stage 5c node. implement divide )

        (
          calculates result for divide.

          always receives 4 words from node 501:

            add: L H x x
            sub: L H x x
            mul: L H 0 x
            div: L2 L1 H2 H1

          out: HL      {to node 602}
        )


        entry fp5c/main

        # up /b

        # left /a


        # 0 org



        +cy


        : fp5c/sec ( x-x )
          // force carry = 1
          dup dup xor inv dup . + drop
        ;



        : fp5c/dbl ( RL DH RH - RL' DH RH' )
          // signed 36-bit R <<= 1
          // preserve DH in the middle
          >r >r
          clc
          dup . +             // RL <<= 1
          r> r>
          dup . +             // RH = RH*2 + carry
        ;



        : fp5c/addd ( RL DH RH - RL' DH RH' )
          // R += D
          // DL is held in A

          >r >r               // RL / RH DH

          clc
          a . +               // RL += DL

          r> r>               // RL' DH RH
          over . +            // RH += DH + carry
        ;



        : fp5c/subd ( RL DH RH - RL' DH RH' )
          // R -= D
          // DL is held in A

          >r >r               // RL / RH DH

          fp5c/sec
          a inv . +           // RL -= DL

          r> r>               // RL' DH RH
          over inv . +        // RH -= DH + borrow
        ;



        : fp5c/q0 ( QL QH - QL' QH' )
          // Q = Q << 1
          >r
          clc
          dup . +
          r>
          dup . +
        ;



        : fp5c/q1 ( QL QH - QL' QH' )
          // Q = (Q << 1) | 1
          >r
          fp5c/sec
          dup . +
          r>
          dup . +
        ;



        : fp5c/div ( L2 L1 H2 H1 - ... QL QH )

          // Put divisor low word in A.
          //
          // input:
          //     L2 L1 H2 H1
          //
          // result:
          //     L1 H2 H1
          //
          // interpreted as:
          //     RL DH RH

          >r >r >r
          a!                   // A = L2 = DL
          r> r> r>             // L1 H2 H1

          // Initial non-restoring remainder:
          //
          // R = M1 - M2

          fp5c/subd            // RL DH RH

          // quotient starts at zero

          0 0                  // RL DH RH QL QH


          // Generate:
          //
          // integer bit + 26 fractional bits
          //
          // Q = floor((M1 << 26) / M2)

          26. >r
          begin

            // temporarily remove Q so remainder is on top

            >r >r               // RL DH RH / QH QL

            // Remember sign of R before doubling.

            dup >r

            // R <<= 1

            fp5c/dbl

            // Original R negative?
            //
            // negative:
            //     bit = 0
            //     R = 2R + D
            //
            // nonnegative:
            //     bit = 1
            //     R = 2R - D

            r> -if
              drop

              fp5c/addd

              r> r>             // restore QL QH
              fp5c/q0

            else
              drop

              fp5c/subd

              r> r>             // restore QL QH
              fp5c/q1

            then

          unext

          // Stack is now:
          //
          //   ... RL DH RH QL QH
          //
          // QH is T, QL is S, exactly what main needs.
        ;


        -cy



        : fp5c/pass
          // ADD/SUB/MUL input is:
          //
          //     L H x x
          //
          // Discard the two unused words, leaving L H.
          drop drop
        ;



        : fp5c/main
          @b @b @b @b
          // ADD/SUB: L H x x
          // MUL:     L H 0 x
          // DIV:     L2 L1 H2 H1

          --l-

          // operation handler leaves:
          //
          //     L H
          //
          // or, for DIV:
          //
          //     ... QL QH

          left a!
          ! !                   // send H then L

          fp5c/main
        ;
