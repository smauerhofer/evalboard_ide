        ( CVM2 node 409. VM 32 bit floatingpoint final stage node )

        (
          receives 1 floatingpoints number and composes it into a IEEE-754 number.
          1. sign: 0 => positive, 0x8000 => negative
          2. type: ==0 => normal or denormalized, !=0 => NaN or infitinte
          3. signed exponent -128 .. 127
          4. mantissa high
          5. mantissa low
          normalize number
          send number to node 509.
        )


        # 0 org

        entry fpf/main

        # left /b

        # up /a


        : fpf/inc 1 . + ;

        : fpf/dec -1 . + ;


        : fpf/normalize ( ehl/s-)


        : fpf/main
          @b >r
          @b if // NaN or infinite
            @b 0xff and 2* 2* 2* 2* 2* 2* 2*
            @b 0x7f and xor r> xor !
            @b 0xffff and ! fpf/main ;
          then // normal number
            // get exponent
            @b 0xff and >r
            @b // high mantissa
            // check if zero
            if // nonzero
              @b // low mantissa
            then
            @b // low mantissa
            // check if zero
            if // nonzero
              fpf/normalize ;
            then // zero
            >r !
            dup xor ! ;
