        fadd 0 2

        fpush 0                   ; expect 3F80 0000  +1.0


        fsub 0 1

        fpush 0                   ; expect 4040 0000  +3.0


        fadd 0 1

        fpush 0                   ; expect 3F80 0000  +1.0


        fsub 0 2

        fpush 0                   ; expect BF80 0000  -1.0




        // ============================================================

        // TEST 6

        // Exact cancellation

        //

        // Under round-to-nearest-even all results must be +0.

        //

        // +1 + (-1) = +0

        // -1 + (+1) = +0

        // +1 - (+1) = +0

        // -1 - (-1) = +0

        // ============================================================


        // fr1 = +1.0


        pushlit 0x3F80

        pushlit 0x0000

        fpop 1


        // fr2 = -1.0


        pushlit 0xBF80

        pushlit 0x0000

        fpop 2



        // +1 + (-1)


        pushlit 0x3F80

        pushlit 0x0000

        fpop 0


        fadd 0 2

        fpush 0                   ; expect 0000 0000



        // -1 + (+1)


        pushlit 0xBF80

        pushlit 0x0000

        fpop 0


        fadd 0 1

        fpush 0                   ; expect 0000 0000



        // +1 - (+1)


        pushlit 0x3F80

        pushlit 0x0000

        fpop 0


        fsub 0 1

        fpush 0                   ; expect 0000 0000



        // -1 - (-1)


        pushlit 0xBF80

        pushlit 0x0000

        fpop 0


        fsub 0 2

        fpush 0                   ; expect 0000 0000




