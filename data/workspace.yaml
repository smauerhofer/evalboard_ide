        : fp5c/q0 ( QL QH - QL' QH' )
          // Q = Q << 1
          >r
          clc
          dup . +
          r>
          dup . +
        ;



        : fp5c/q1 ( QL QH - QL' QH' )
          // Q = (Q << 1) | 1
          >r
          fp5c/sec
          dup . +
          r>
          dup . +
        ;



        : fp5c/div ( L2 L1 H2 H1 - ... QL QH )

          // Put divisor low word in A.
          //
          // input:
          //     L2 L1 H2 H1
          //
          // result:
          //     L1 H2 H1
          //
          // interpreted as:
          //     RL DH RH

          >r >r >r
          a!                   // A = L2 = DL
          r> r> r>             // L1 H2 H1

          // Initial non-restoring remainder:
          //
          // R = M1 - M2

          fp5c/subd            // RL DH RH

          // quotient starts at zero

          0 0                  // RL DH RH QL QH


          // Generate:
          //
          // integer bit + 26 fractional bits
          //
          // Q = floor((M1 << 26) / M2)

          26. >r
          begin

            // temporarily remove Q so remainder is on top

            >r >r               // RL DH RH / QH QL

            // Remember sign of R before doubling.

            dup >r

            // R <<= 1

            fp5c/dbl

            // Original R negative?
            //
            // negative:
            //     bit = 0
            //     R = 2R + D
            //
            // nonnegative:
            //     bit = 1
            //     R = 2R - D

            r> -if
              drop

              fp5c/addd

              r> r>             // restore QL QH
              fp5c/q0

            else
              drop

              fp5c/subd

              r> r>             // restore QL QH
              fp5c/q1

            then

          unext

          // Stack is now:
          //
          //   ... RL DH RH QL QH
          //
          // QH is T, QL is S, exactly what main needs.
        ;


