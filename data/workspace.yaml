          e = 0
          H:L shifted right as required by node 403

        overflow:
          e = 255
          H:L = 0

        output mantissa:

          h = bits 23..16
          l = bits 15..0

        normal:
          h.7 is the hidden bit

        subnormal:
          h.7 = 0

        rounding:

          round 27 bits to 24 bits by adding 4 before
          discarding the lowest three bits.

          no sticky bit is used.
          exact halfway cases round upward in magnitude.

