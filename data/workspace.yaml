      sourceCode: >-
        ( CVM2 node 201. VM 32 bit floatingpoint step 5.


        mantissa preparation.


        optional magnitude comparison

          in:  h1 h2 l1 l2  {from node 202}
          out: H1 H2 L1 L2  {to node 301}
        optional:
          out: c             {to node 202}

          c: magnitude compare result
            0x8000  : |f1| >  |f2|
            0       : |f1| == |f2|
            0x20000 : |f1| <  |f2|
        )


        # down /a

        # left /b

        entry f5/main


        # 0 org


        : f5/sub inv . +

        : f5/inc 1 . + ;


        : f5/gt ( diff - c )
          -if
            drop 0x20000 ;       // f1 < f2
          then
          if
            drop 0x8000 ;        // f1 > f2
          then
          // diff = 0 -> equal, leave 0
        ;


        : f5/extend ( h l - H L)
          dup 0x8000 and
          if
            drop
            >r 2* 1 xor r> ..
          else
            drop
            >r 2* r>
          then
          2* 2* 2*
        ;



        : f5/ignore // no compare calculation
          ( l1 l2 h1 h2 )
          ;

        : f5/calc   // compare calculation
          ( l1 l2 h1 h2 )
          f5/sub
          if f5/gt !b ; then
          drop
          f5/sub
          f5/gt
          !b
        ;


        : f5/main
          @b               // h1
          ( h1 )
          @b               // h2
          ( h1 h2 )

          // save h2 h1 for optional magnitude comparison

          dup >r over >r
          ( h1 h2 / h2 h1 )

          @b               // l1
          ( h1 h2 l1 / h2 h1 )
          @b               // l2
          ( h1 h2 l1 l2 / h2 h1 )

          // save l2 l1 for optional magnitude comparison

          dup >r over >r
          ( h1 h2 l1 l2 / h2 h1 l2 l1 )

          // rearrange h1 h2 l1 l2 into the two
          // h,l pairs required by f5/extend

          >r
          ( h1 h2 l1 / h2 h1 l2 l1 l2 )

          a!
          ( h1 h2 / h2 h1 l2 l1 l2 )

          >r a
          ( h1 l1 / h2 h1 l2 l1 l2 h2 )

          f5/extend
          ( H1 L1 / h2 h1 l2 l1 l2 h2 )

          r> r>
          ( H1 L1 h2 l2 / h2 h1 l2 l1 )

          f5/extend
          ( H1 L1 H2 L2 / h2 h1 l2 l1 )

          down a!

          >r >r >r !       // H1
          r> r> !           // H2
          !                 // L1
          r> !              // L2

          ( / h2 h1 l2 l1 )

          // restore original mantissas for optional compare

          r> r> r> r>
          ( l1 l2 h1 h2 )

          // focusing call: node 202 supplies f5/ignore
          // or f5/calc

          left a!
          --l-

          f5/main
        ;
