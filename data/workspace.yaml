      sourceCode: >-
        ( CVM2 node 602. VM 32 bit floatingpoint stage 4c node. normalize result )

        (
          normalizes exponent and mantissa.

          in:
            E           {from node 502}
            H L         {from node 601}

          out:
            E H L       {to node 603}

          Mantissa is 27 bits:
            H = high part
            L = low 18 bits

          hidden bit   = 0x100 in H
          overflow bit = 0x200 in H
        )

        # 601 import


        entry fp4c/main

        # right /b


        # 0 org



        +cy


        : fp4c/shl ( E H L - E' H' L' )
          // E--

          >r >r
          clc
          0 inv . +              // E-1
          r> r>                   // E' H L

          // H:L <<= 1

          clc
          dup . + >r              // L'=L*2, retain carry
          dup . +                 // H'=H*2+carry
          r>
        ;


        -cy



        : fp4c/shr ( E H L - E' H' L' )
          // H:L >>= 1

          a!                      // A=L
          >r                      // save H

          1 . +                   // E++

          r>                      // E' H
          0 over
          . +*                    // shift H:A right

          >r drop drop
          r> a                    // E' H' L'
        ;



        : fp4c/norm ( E H L - E' H' L' )

          // any bits above hidden bit:
          // result is too large, shift right until H < 0x200

          over 0x1ff inv and
          if
            drop
            fp4c/shr
            fp4c/norm ;
          then
          drop

          // normalized?
          over 0x100 and
          if
            drop ;
          then
          drop

          // H != 0
          .. over
          if
            drop
            fp4c/shl
            fp4c/norm ;
          then
          drop

          // H=0, but L != 0
          dup
          if
            drop
            fp4c/shl
            fp4c/norm ;
          then
          drop

          // zero
        ;


        : fp4c/div
          A[ fp5c/div ; ]] lit !
        ;


        : fp4c/add

        : fp4c/sub

        : fp4c/mul

        : fp4c/pass
          A[ fp5c/pass ; ]] lit !
        ;



        : fp4c/main
          up a!
          @                        // E from 502

          left a!

          r--- // give control to node 603

          @                        // H from 601
          @                        // L from 601

          ( E H L )

          fp4c/norm

          ( E H L )

          // send E H L to node 603

          >r >r
          !b                       // E
          r> !b                    // H
          r> !b                    // L

          fp4c/main
