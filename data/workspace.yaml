        # 307 import

        # 0 org

        entry main

        # 0 # 1 /stack

        # left /a

        # up /b


        : main A[ drop !p ]] lit !b @b >r ex

        : leave A[ ; ]] lit !b main ;

        : sr16 ( w-w) 7 for 2/ 2/ unext

        : c! 3 and ;

        : sl16 ( w-w) 7 for 2* 2* unext ;

        : r@ ( -w) A[ a !p ]] lit !b @b ;

        : 'hi@ dup sr16

        : r! ( w) A[ @p a! ]] lit !b !b ;

        : 'xpt a r@ a! r! ;

        : 'out dup ! ;

        : 'in @ ;

        : 'lo@ dup r! ;

        : 'hi! xffff and r@ sl16 xor ;

        : 'lo! x30000 and r@ xor ;

        : spop ( -w) A[ s/pop ]] lit !b A[ !p ]] lit !b @b ;

        : spush ( w) A[ @p s/push ]] lit !b !b ;

        (

        'xpt  exchanges port register with R.

        'out  writes 18 bit value to port.

        'in  reads 18 bit value from port.

        'hi@  moves hi 2 bits from value to R.

        'lo@  moves lo 16 bit from value to R.

        'hi!  moves 2 bits from R to hi value.

        'lo!  moves 16 bits from R to lo value.

        )
