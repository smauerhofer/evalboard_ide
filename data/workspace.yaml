          over over fp6/or

          // any NaN?
          dup 4 and
          if
            drop drop drop drop
            3 ;
          then
          drop

          // any infinity?
          2 and
          if
            drop

            // both infinity?
            and 2 and
            if
              drop
              4 ;
            then

            drop
            2 ;
          then

          drop drop drop
          0
        ;



