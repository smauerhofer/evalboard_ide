    - coordinate: 305
      enabled: true
      sourceCode: >-
        ( CVM2 node 305. VM 32 bit floatingpoint stage 1 node. unpack and pack )

        (
          receives 2 floatingpoint numbers and decomposes each into

          1. sign:
               0       => positive
               0x8000  => negative

          2. exponent:
               IEEE-754 biased exponent, 0x00 .. 0xff

          3. mantissa high:
               normal numbers have implicit leading 1 made explicit in bit 7

          4. mantissa low

          in:    ohlhl           {from node 306}
          out:   osehlsehl       {to node 304}
          in:    sehl            {from node 304}
          out:   hl              {to node 306}
        )


        # 0 org

        entry fp1/main


        # left /b

        # right /a



        : fp1/final ( l h - )
          0x7f and
          !                       // h
          !                       // l
        ;



        : fp1/decompose ( - )
          @b >r                   // h
          @b r>                   // l h

          ( l h )
          // sign

          dup 0x8000 and
          !                       // s


          // exponent

          dup
          2/ 2/ 2/ 2/ 2/ 2/ 2/
          0xff and

          dup !                   // e


          // Add explicit hidden bit only for a normal number:
          //
          //   e = 0       zero/subnormal
          //   e = ff      infinity/NaN
          //   otherwise   normal

          if                      // e != 0

            0xff xor ..

            if                    // e != ff
              drop
              ( l h )

              0x7f and
              0x80 xor            // explicit hidden bit
              !                   // h
              !                   // l
              ;
            then
          then

          // exponent 0 or ff:
          // no hidden bit

          drop
          fp1/final
        ;



        // read sehl from node 304 and compose binary32


        : fp1/compose

          // sign
          @

          // exponent
          @
          2* 2* 2* 2* 2* 2* 2*
          xor

          // mantissa high
          // remove explicit hidden bit
          @
          0x7f and
          xor
          !b

          // mantissa low
          @
          0xffff and
          !b


        : fp1/main
          @b !                    // o
          fp1/decompose           // operand 1
          fp1/decompose           // operand 2

          fp1/compose
        ;
