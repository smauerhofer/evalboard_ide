        # 602 import


        entry fp3c/main

        # up /a

        # left /b


        # 8 org



        : fp3c/shr ( E H L - E' H' L' )
          // E++, H:L >>= 1

          a!                    // A=L
          >r                    // / H

          1 . +                 // E++

          r>                    // E' H
          0 over
          . +*                  // H:A >>= 1

          >r drop drop
          r> a                  // E' H' L'
        ;



        : fp3c/subnormal ( E H L - 0 H' L' )
