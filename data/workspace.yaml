        // bit15 = s1

        // bit14 = effective s1 xor s2


        : fp3c/add
          over xor 2/ xor
          !b              // s
          A[ fp4c/add ; ]] lit !
        ;


        : fp3c/sub
          over xor 2/ xor !b
          A[ fp4c/sub ; ]] lit !
        ;



