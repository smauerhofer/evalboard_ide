        ( cvm in/out support, 1111_????_????_????)

        # 507 import

        # 0 org

        entry main

        # 0 # 1 /stack

        # up /a

        # down /b


        : t/r@ ( -w) .loc A[ a !p ]] lit !b @b ;

        : t/r! ( w) .loc A[ @p a! ]] lit !b !b ;

        : t/push ( w) .loc A[ @p s/push ]] lit !b !b ;

        : t/pop ( -w) .loc A[ s/pop ]] lit !b A[ !p ]] lit !b @b ;

        : leave A[ ; ]] lit !b 

        : main A[ 2* !p !p ]] lit !b
          @b @b >r ..
          -if // 1111_1???_????_????
            2* -if // 1111_11??_????_????
              --l- leave ;
            then // 1111_10??_????_????
              r--- leave ;
          then  // 1111_0???_????_????
          ex leave ;
        : sr16 ( w-w) 7 for 2/ 2/ unext

        : c! 3 and ;

        : sl16 ( w-w) 7 for 2* 2* unext ;

        : r@ ( -w) A[ a !p ]] lit !b @b ;

        : 'ldhi dup sr16

        : r! ( w) A[ @p a! ]] lit !b !b ;

        : 'xpt a r@ a! r! ;

        : 'out dup ! ;

        : 'in @ ;

        : 'ldlo dup r! ;

        : 'sthi xffff and r@ sl16 xor ;

        : 'stlo x30000 and r@ xor ;

        : spop ( -w) A[ s/pop ]] lit !b A[ !p ]] lit !b @b ;

        : spush ( w) A[ @p s/push ]] lit !b !b ;

        (

        'xpt  exchanges port register with R.

        'out  writes 18 bit value to port.

        'in  reads 18 bit value from port.

        'ldhi  moves hi 2 bits from value to R.

        'ldlo  moves lo 16 bit from value to R.

        'sthi  moves 2 bits from R to hi value.

        'stlo  moves 16 bits from R to lo value.

        )
