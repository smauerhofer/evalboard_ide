        	then 2* -if
        : cleanup A[ @p /pop ]] lit !b a !b A[ !p 'ret ]] lit !b @b a! r>

        : adjust A[ @p . + ; ]] lit !b !b main ;

        : enter then A[ @p /push ]] lit !b a !b A[ dup !p ]] lit !b @b a! r> inv adjust ;

        : 'xf ( s-s) a A[ @p /r@ ]] lit !b !b A[ !p /r! ; ]] lit !b @b a! ;

        : 'exit 1 A[ @p a! ]] lit !b !b

        : 'wait A[ @b drop ; ]] lit !b ;


