        (
          performs final round-to-nearest-even and reduces
          the extended 27-bit mantissa to binary32 precision.

          in:  sehl       {from node 504}
          out: sehl       {to node 304}

          input mantissa:
            H = high 9+ bits
            L = low 18 bits

            L bit3 = retained LSB
            L bit2 = guard
            L bit1 = round
            L bit0 = sticky

          output mantissa:
            h = high 8 bits, explicit hidden bit in bit7
            l = low 16 bits
        )


