          //
          // p2 = H2*L1
          // p1 = H1*L2
          // ------------------------------------------------

          f5a/m9                    // H1 L2 p2H p2L
          >r >r                     // save p2

          f5a/m9                    // p1H p1L
          r> r>                     // p1H p1L p2H p2L


