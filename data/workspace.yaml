        # up /a

        # left /b


        # 8 org



        : fp6/or ( a b-c )
          >r inv r> inv and inv
        ;



        // map type-like value to result class

        //

        // 0 -> 0 finite

        // 1 -> 1 zero

        // 2 -> 2 infinity

        // anything with NaN bit -> 3


        : fp6/type ( t-k )
          dup 4 and
          if
            drop drop 3 ;
          then
          drop
          3 and
        ;



        // MIN/MAX/NOP/SWAP

        //

        // 403 already selected/reordered the operand.

        // t1 is therefore the selected type.


        : fp6/select ( t1 t2-k )
          drop
          fp6/type
        ;



        // MUL

        //

        // OR gives:

        //

        // 0 finite

        // 1 zero

        // 2 infinity

        // 3 zero*infinity

        //

        // NaN bit is handled by fp6/type.


        : fp6/mul ( t1 t2-k )
          fp6/or
          fp6/type
        ;



        // DIV

        //

        // swap denominator zero/infinity:

        //

        // 0 -> 0

        // 1 -> 2

        // 2 -> 1

        //

        // OR with numerator:

        //

        // 0 finite

        // 1 zero

        // 2 infinity

        // 3 invalid

        //

        // NaN bit survives.


        : fp6/div ( t1 t2-k )
          if
            3 xor
          then
          fp6/or
          fp6/type
        ;



        // ADD/SUB

        //

        // any NaN  -> 3

        // one Inf  -> 2

        // both Inf -> 4

        // otherwise 0


