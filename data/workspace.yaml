          // ------------------------------------------------

          >r >r
          over over f5b/m9
          drop drop
          r> r>

          a >r


          // ------------------------------------------------
          // reorder
          //
          // H1 H2 L1 L2
          // -> H1 L2 H2 L1
          // ------------------------------------------------

          a! >r a r>
          >r
          a! >r a r>
          r>


          // ------------------------------------------------
