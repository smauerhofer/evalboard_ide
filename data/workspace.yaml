    - coordinate: 103
      enabled: true
      sourceCode: >-
        ( CVM2 node 103. VM 32 bit floatingpoint special step 3.
         handle special cases for ADD/SUB/MUL/DIV.
         MUL/DIV are delegated to node 102.

        this is a slave node to node 104.


        input after remote call:

          T t1 t2 s1 s2 e1 e2 h1 h2 l1 l2

        output:

          s e h l

        register A is free to use.

        register A is set to right for MUL/DIV


        )


        # 102 import

        # left /b

        # --l- /p



        // Return operand 1.

        // sign is on T.

        // remaining input: e1 e2 h1 h2 l1 l2


        : fs3/r1
          !b
          @b @b drop !b
          @b @b drop !b
          @b @b drop !b
        ;



        // Return operand 2.

        // sign is on T.


        : fs3/r2
          !b
          @b drop @b !b
          @b drop @b !b
          @b drop @b !b
        ;



        // canonical qNaN


        : fs3/qnan
          @b @b @b @b @b @b
          1 // s == 1 means canonical qNaN
          !b !b !b !b
        ;



        // ADD/SUB common.

        //

        // m = 0000 ADD

        // m = 8000 SUB

        //

        // A = effective sign of operand 2


        : fs3/add
          dup xor

        : fs3/as ( m )
          a!

          @b >r                    // T
          @b @b                    // t1 t2
          @b                       // s1
          @b a xor a!              // effective s2
          r>
          ( t1 t2 s1 T )


          // NaN

          dup 4 and
          if
            fs3/qnan ;
          then
          drop


          // Infinity

          2 and
          if
            drop
            >r
            ( t1 t2 / s1 )

            over 2 and
            if                       // operand 1 infinity
              drop

              dup 2 and
              if                     // both infinity
                drop
                r> dup a xor

                if                   // opposite effective signs
                  fs3/qnan ;
                then

                drop
                fs3/r1 ;
              then

              drop
              r>
              fs3/r1 ;
            then

            drop
            r> drop
            a
            fs3/r2 ;
          then
          drop


          // Zero cases

          >r
          ( t1 t2 / s1 )

          over
          if                        // operand 1 zero
            drop

            dup
            . if                      // both zero
              drop
              r> a and
              fs3/r1 ;
            then

            drop                    // 0 +/- x
            r> drop
            a
            fs3/r2 ;
          then

          drop                      // x +/- 0
          r>
          fs3/r1
        ;



        : fs3/sub
          0x8000
          fs3/as
        ;



        // pass complete packet unchanged to node 102


        : fs3/pass
          right a!
          !
          10 for @b ! unext

          @ !b
          @ !b
          @ !b
          @ !b
        ;



        : fs3/mul
          A[ fs4/mul ]] lit
          fs3/pass
        ;



        : fs3/div
          A[ fs4/div ]] lit
          fs3/pass
        ;
