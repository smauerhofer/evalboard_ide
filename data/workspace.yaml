    - coordinate: 601
      enabled: true
      sourceCode: >-
        ( CVM2 node 601. VM 32 bit floatingpoint stage 5c node. implement divide )

        (
          calculates result for divide.

          always receives 4 words from node 501:

            add:    L H x x
            sub:    L H x x
            mul:    L H 0 x
            div:    L2 L1 H2 H1
            select: L2 L1 H2 H1

          out: HL      {to node 602}
        )


        entry fp5c/main

        # up /b

        # left /a


        # 0 org



        +cy


        : fp5c/sec ( x-x )
          // force carry = 1
          dup dup xor inv dup . + drop
        ;



        : fp5c/dbl ( RL DH RH - RL' DH RH' )
          // signed 36-bit R <<= 1
          // preserve DH in the middle

          >r >r
          clc
          dup . +             // RL <<= 1
          r> r>
          dup . +             // RH = RH*2 + carry
        ;



        : fp5c/addd ( RL DH RH - RL' DH RH' )
          // R += D
          // DL is held in A

          >r >r               // RL / RH DH

          clc
          a . +               // RL += DL

          r> r>               // RL' DH RH
          over . +            // RH += DH + carry
        ;



        : fp5c/subd ( RL DH RH - RL' DH RH' )
          // R -= D
          // DL is held in A

          >r >r               // RL / RH DH

          fp5c/sec
          a inv . +           // RL -= DL

          r> r>               // RL' DH RH
          over inv . +        // RH -= DH + borrow
        ;



        : fp5c/q0 ( QL QH - QL' QH' )
          // Q = Q << 1

          >r
          clc
          dup . +
          r>
          dup . +
        ;



        : fp5c/q1 ( QL QH - QL' QH' )
          // Q = (Q << 1) | 1

          >r
          fp5c/sec
          dup . +
          r>
          dup . +
        ;



        : fp5c/div ( L2 L1 H2 H1 - ... QL QH )

          // Put divisor low word in A.
          //
          // input:
          //     L2 L1 H2 H1

          >r >r >r
          a!                   // A = L2 = DL
          r> r> r>             // L1 H2 H1

          // Initial non-restoring remainder:
          // R = M1 - M2

          fp5c/subd            // RL DH RH

          // quotient starts at zero

          0 0                  // RL DH RH QL QH


          // integer bit + 26 fractional bits

          26. >r
          begin

            >r >r               // RL DH RH / QH QL

            // Remember sign of R before doubling.

            dup >r

            fp5c/dbl

            r> -if
              drop

              fp5c/addd

              r> r>
              fp5c/q0

            else
              drop

              fp5c/subd

              r> r>
              fp5c/q1

            then

          unext

          // ... RL DH RH QL QH
        ;


        -cy



        : fp5c/pass
          // ADD/SUB/MUL:
          //
          // L H x x -> L H

          drop drop
        ;



        : fp5c/select
          // MIN/MAX/NOP/SWAP:
          //
          // L2 L1 H2 H1
          //
          // selected operand is operand1.
          // Leave top two words as L1 H1.

          a! drop a
        ;



        : fp5c/main
          @b @b @b @b

          --l-

          // handler leaves L H
          // or DIV leaves ... QL QH

          left a!
          ! !                   // send H then L

          fp5c/main
        ;
