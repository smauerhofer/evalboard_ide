          // 24-bit significand:
          //
          //   h = H[8:1]
          //
          // A rounding carry may temporarily produce
          // h=0x100; f6/fix handles that.

          dup 2/ >r

          // Shift the complete H:L value right three bits.
          //
          // S=0, T=H, A=L
          //
          // After the shifts, the low 16 bits of A are:
          //
          //   H[0] : L[17:3]

