    - name: fmul regression test
      source: >-
        //

        // FMUL regression test 1

        //



        // ============================================================

        // TEST 1

        // Basic normal multiplication

        // ============================================================



        // 1.0 * 1.0 = 1.0


        pushlit 0x3F80

        pushlit 0x0000

        fpop 0


        pushlit 0x3F80

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 3F80 0000  +1.0



        // 2.0 * 3.0 = 6.0


        pushlit 0x4000

        pushlit 0x0000

        fpop 0


        pushlit 0x4040

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 40C0 0000  +6.0



        // 1.5 * 2.0 = 3.0


        pushlit 0x3FC0

        pushlit 0x0000

        fpop 0


        pushlit 0x4000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 4040 0000  +3.0



        // 1.5 * 1.5 = 2.25


        pushlit 0x3FC0

        pushlit 0x0000

        fpop 0


        pushlit 0x3FC0

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 4010 0000  +2.25



        // 0.75 * 0.5 = 0.375


        pushlit 0x3F40

        pushlit 0x0000

        fpop 0


        pushlit 0x3F00

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 3EC0 0000  +0.375



        // mantissa stress

        //

        // 0x3FFFFFFF * 0x3FFFFFFF

        // = 0x407FFFFE


        pushlit 0x3FFF

        pushlit 0xFFFF

        fpop 0


        pushlit 0x3FFF

        pushlit 0xFFFF

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 407F FFFE




        // ============================================================

        // TEST 2

        // Sign handling

        // ============================================================



        // -2 * +3 = -6


        pushlit 0xC000

        pushlit 0x0000

        fpop 0


        pushlit 0x4040

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect C0C0 0000  -6.0



        // -2 * -3 = +6


        pushlit 0xC000

        pushlit 0x0000

        fpop 0


        pushlit 0xC040

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 40C0 0000  +6.0



        // +2 * -3 = -6


        pushlit 0x4000

        pushlit 0x0000

        fpop 0


        pushlit 0xC040

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect C0C0 0000  -6.0



        // -0 * +2 = -0


        pushlit 0x8000

        pushlit 0x0000

        fpop 0


        pushlit 0x4000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 8000 0000  -0



        // -0 * -2 = +0


        pushlit 0x8000

        pushlit 0x0000

        fpop 0


        pushlit 0xC000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 0000 0000  +0




        // ============================================================

        // TEST 3

        // Exponent boundaries

        // ============================================================



        // minimum normal * 2

        //

        // 00800000 * 2 = 01000000


        pushlit 0x0080

        pushlit 0x0000

        fpop 0


        pushlit 0x4000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 0100 0000



        // minimum normal * 0.5

        //

        // result is subnormal

        //

        // 00800000 * .5 = 00400000


        pushlit 0x0080

        pushlit 0x0000

        fpop 0


        pushlit 0x3F00

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 0040 0000



        // maximum finite * 0.5


        pushlit 0x7F7F

        pushlit 0xFFFF

        fpop 0


        pushlit 0x3F00

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 7EFF FFFF



        // maximum finite * 2 -> infinity


        pushlit 0x7F7F

        pushlit 0xFFFF

        fpop 0


        pushlit 0x4000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 7F80 0000




        // ============================================================

        // TEST 4

        // Subnormal operands

        //

        // These tests exercise exponent=0 operands directly.

        // ============================================================



        // smallest subnormal * 1


        pushlit 0x0000

        pushlit 0x0001

        fpop 0


        pushlit 0x3F80

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 0000 0001



        // smallest subnormal * 2


        pushlit 0x0000

        pushlit 0x0001

        fpop 0


        pushlit 0x4000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 0000 0002



        // largest subnormal * 2

        //

        // 007FFFFF * 2 = 00FFFFFE


        pushlit 0x007F

        pushlit 0xFFFF

        fpop 0


        pushlit 0x4000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 00FF FFFE



        // smallest subnormal * 0.5

        //

        // exact result is below minimum representable subnormal.

        // RNE result = +0.


        pushlit 0x0000

        pushlit 0x0001

        fpop 0


        pushlit 0x3F00

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 0000 0000




        // ============================================================

        // TEST 5

        // Zero, infinity and NaN classification

        // ============================================================



        // +0 * +3 = +0


        pushlit 0x0000

        pushlit 0x0000

        fpop 0


        pushlit 0x4040

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 0000 0000



        // +inf * +2 = +inf


        pushlit 0x7F80

        pushlit 0x0000

        fpop 0


        pushlit 0x4000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 7F80 0000



        // -inf * +2 = -inf


        pushlit 0xFF80

        pushlit 0x0000

        fpop 0


        pushlit 0x4000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect FF80 0000



        // -inf * -2 = +inf


        pushlit 0xFF80

        pushlit 0x0000

        fpop 0


        pushlit 0xC000

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 7F80 0000



        // +0 * +inf = canonical qNaN


        pushlit 0x0000

        pushlit 0x0000

        fpop 0


        pushlit 0x7F80

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 7FC0 0000



        // qNaN * 1 = canonical qNaN


        pushlit 0x7FC0

        pushlit 0x0000

        fpop 0


        pushlit 0x3F80

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 7FC0 0000



        // sNaN * 1 = canonical qNaN


        pushlit 0x7FA0

        pushlit 0x0000

        fpop 0


        pushlit 0x3F80

        pushlit 0x0000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 7FC0 0000




        // ============================================================

        // TEST 6

        // Rounding

        //

        // These exercise the low product bits and RNE.

        // ============================================================



        // low mantissa multiplication

        //

        // 3F800800 * 3F800800

        // -> 3F801000


        pushlit 0x3F80

        pushlit 0x0800

        fpop 0


        pushlit 0x3F80

        pushlit 0x0800

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 3F80 1000



        // RNE case

        //

        // 3F800C00 * 3F801000

        // -> 3F801C02


        pushlit 0x3F80

        pushlit 0x0C00

        fpop 0


        pushlit 0x3F80

        pushlit 0x1000

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 3F80 1C02



        // sticky-bit-sensitive case

        //

        // 3F800100 * 3F804002

        // -> 3F804103

        //

        // This is useful for detecting loss of discarded

        // multiplication product bits.


        pushlit 0x3F80

        pushlit 0x0100

        fpop 0


        pushlit 0x3F80

        pushlit 0x4002

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 3F80 4103



        // very low product bits

        //

        // 3F800001 * 3F800001

        // -> 3F800002


        pushlit 0x3F80

        pushlit 0x0001

        fpop 0


        pushlit 0x3F80

        pushlit 0x0001

        fpop 1


        fmul 0 1

        fpush 0                   ; expect 3F80 0002




        nop

