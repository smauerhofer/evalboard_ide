          0x7218 , 0x3F31 , // 0: ln(2)       = 0.69314718
          0xAA3B , 0x3FB8 , // 1: 1/ln(2)     = 1.44269504
          0x0FDB , 0x3FC9 , // 2: pi/2        = 1.57079633
          0xF983 , 0x3F22 , // 3: 2/pi        = 0.63661977

