        fdiv a b ; fr[a] = fr[a] / fr[b]

        fmove a b ; fr[a] = fr[b]

        fconst a b ; fr[a] = const[b]

        fneg a b ; fr[a] = neg{fr[b]}

        fabs a b ; fr[a] = abs{fr[b]}

        fpop a ; ggg is not used {only 1 argument}

