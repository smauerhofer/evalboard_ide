        ( CVM2 node 404. VM 32 bit floatingpoint step 6.


        rounding and packing mantissa to 24 bit {8:16}.

          in: s e H L      {result from node 403}

          out: s e h l     {result to node 304}

        input format:


        normal:
          e = 1..254
          H:L 27-bit internal format
          hidden bit = H.8

        subnormal:
          e = 0
          H:L shifted right as required by node 403

        overflow:
          e = 255
          H:L = 0

        output mantissa:

          h = bits 23..16
          l = bits 15..0

        normal:
          h.7 is the hidden bit

        subnormal:
          h.7 = 0

        rounding:

          round 27 bits to 24 bits by adding 4 before
          discarding the lowest three bits.

          no sticky bit is used.
          exact halfway cases round upward in magnitude.

        during processing:
          stack: s e H
          A:     L

        )


