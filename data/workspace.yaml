    - coordinate: 305
      enabled: true
      sourceCode: >+
        ( CVM2 node 305. VM 32 bit floatingpoint stage 1 node. unpack and pack )

        (

        receives 2 floatingpoint numbers and decomposes each into


        1. sign:
              0       => positive
              0x8000  => negative

        2. type:
              t = 0x00   finite nonzero
              t = 0x01   zero
              t = 0x02   infinity
              t = 0x04   qNaN
              t = 0x0c   sNaN       // NAN bit + signaling bit

        3. exponent:
              IEEE-754 biased exponent, 0x00 .. 0xff

        4. mantissa high:
              normal numbers have implicit leading 1 made explicit in bit 7

        5. mantissa low

          in: ohlhl
          out: otsehltsehl
          reply: sehl

        )

        # 0 org

        entry fp1/main

        # left /b

        # right /a


        : fp1/fold ( lh-lhf) over over 0x7f and 

        : fp1/or ( ab-c) >r inv r> inv and inv ;


        : fp1/decompose ( )
          @b >r @b r> ( lh )

          // sign
          dup 0x8000 and >r
          ( lh )                          // R: s

          // exponent
          dup 2/ 2/ 2/ 2/ 2/ 2/ 2/ 0xff and ..
          ( lhe )

          if // exp != 0

            dup 0xff xor if // normal
              dup xor !                    // t = 0
              r> !                         // s
              !                            // e
              0x7f and 0x80 xor ! ! ;     // h l
            then

            // NaN or infinity
            drop
            ( lhe )                        // e = ff
            >r                             // R: s e
            fp1/fold

            if // NaN
              drop
              ( lh )
              dup 0x40 and 2/ 2/ 2/ 0x0c xor
              !                            // t
              r> r> ! !                    // s e

        : fp1/final ( lh-) 0x7f and ! ! ;

            then // infinity
            drop
            2 !                            // t
            r> r> ! !                     // s e
            fp1/final ;

          then // denormalized or zero

          ( lhe )                          // e = 0
          >r                               // R: s e
          fp1/fold

          if // denormalized number
            drop
            r> dup !                       // t = e = 0, retain e
            r> !                           // s
            !                              // e
            fp1/final ;
          then

          // zero
          drop
          1 !                              // t
          r> r> ! !                       // s e
          fp1/final ;

        : fp1/compose // read stehl from up and convert it to a 32-bit IEEE-754 number
          up a!
          // sign
          @
          // exponent
          @ 2* 2* 2* 2* 2* 2* 2* xor
          // mantissa high
          @ 0x7f and xor !b
          // mantissa low
          @ 0xffff and !b
        : fp1/main right a!
          @b ! // o
          fp1/decompose
          fp1/decompose
          fp1/compose ;




