      sourceCode: >-
        ( CVM2 node 403. VM 32 bit floatingpoint step 3b.


        sign handling, exponent range checking and

        subnormal preparation.

          in: s            {sign from node 303}
          in: e H L        {normalized result from node 402}

          out: s e H L     {range-adjusted result to node 404}

        output format:


        normal:
          e = 1..254
          H:L remains in 27-bit internal format

        subnormal:
          e = 0
          H:L shifted right as required

        overflow:
          e = 255
          H:L = 0

        during processing:
          stack: s e h
          A:     l

        )


        entry f3b/main


        # 0 org



        : f3b/shr ( s e h - s e h' ) // A=l -> A=l'
          // H:L >>= 1
          //
          // S=0, T=H, A=L

          0 over
          . +*

          >r
          drop drop
          r>
        ;



        : f3b/sub ( s e h - s 0 h' ) // A=l -> A=l'
          // e <= 0
          //
          // shift mantissa by:
          //
          //   1 - e
          //
          // For unext the initial count is therefore -e.

          over inv 1 . + >r       // R = -e

          // replace exponent by zero

          >r
          drop
          0
          r>

          begin
            f3b/shr
          unext
        ;



        : f3b/adjust ( s e h - s e' h' ) // A=l -> A=l'
          // e < 0   -> subnormal
          // e = 0   -> subnormal
          // 1..254  -> unchanged
          // e >=255 -> infinity

          over

          . -if
            // e < 0

            drop
            f3b/sub
            ;
          then

          . if
            // e > 0

            drop

            // Test e < 255.

            over
            -255 . +

            . -if
              // 1 <= e <= 254

              drop
              ;
            then

            // e >= 255

            drop

            // s e h -> s 255 0
            // A      -> 0

            drop drop
            255
            0 dup a!
            ;
          then

          // e == 0

          drop
          f3b/sub
        ;



        : f3b/main
          up b!                   // node 303
          @b                      // s
