      sourceCode: >-
        ( CVM2 node 602. VM 32 bit floatingpoint stage 4c node. normalize )

        (
          receives exponent from node 502 and mantissa from node 601.

          arithmetic:
            normalize result

          pass:
            preserve selected operand.
            For E=0 pre-shift mantissa left once because node 603
            will perform one subnormal right shift.
        )


        # 601 import


        entry fp4c/main

        # up /a

        # right /b


        # 0 org



        +cy


        : fp4c/shl
          >r >r

          clc
          0 inv . +              // E--

          r> r>

        : fp4c/shlm
          // E H L -> E H' L'
          // shift mantissa only

          clc
          dup . + >r
          dup . +
          r>
        ;


        -cy



        : fp4c/shr
          a! >r

          1 . +                  // E++

          r>

          0 over
          . +*

          >r drop drop
          r> a
        ;



        : fp4c/norm

          // overflow bit set -> shift right

          over 0x1ff inv and
          if
            drop
            fp4c/shr
            fp4c/norm ;
          then
          drop

          // normalized hidden bit present

          over 0x100 and
          if
            drop ;
          then
          drop

          // nonzero high part -> shift left

          .. over
          if
            drop
            fp4c/shl
            fp4c/norm ;
          then
          drop

          // high is zero, low nonzero -> shift left

          dup .
          if
            drop
            fp4c/shl
            fp4c/norm ;
          then
          drop
        ;



        : fp4c/send
          >r >r
          !b
          r> !b
          r> !b
        ;



        : fp4c/calc
          @ @
          fp4c/norm
          fp4c/send
        ;



        : fp4c/add

        : fp4c/sub

        : fp4c/mul
          A[ fp5c/pass ; ]] lit !
          fp4c/calc
        ;



        : fp4c/pass
          A[ fp5c/select ; ]] lit !

          // E is already on the stack.
          // IF does not consume it.

          if
            @ @
            fp4c/send ;
          then

          // E=0: compensate for the shift that 603 will perform.

          @ @
          fp4c/shlm
          fp4c/send
        ;



        : fp4c/div
          A[ fp5c/div ; ]] lit !
          fp4c/calc
        ;



        : fp4c/main
          up a!
          @                       // E

          left a!

          r---                    // operation from node 603

          fp4c/main
        ;
