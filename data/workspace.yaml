    - coordinate: 401
      enabled: true
      sourceCode: >-
        ( CVM2 node 401. VM 32 bit floatingpoint step 5b.


        this node is a slave of node 402.


        node 402 sends one of the following instructions:
         A[ f5b/div ; ]] for division
         A[ f5b/pass ; ]] for all other operations

        result passing and division.

          in: H1 H2 L1 L2 {extended mantissas from node 301}
        alternative
          in: H L          {extended result mantissa from node 301}

          out: H L         {extended result mantissa to node 402}

        )


        # up /b     // node 301

        # left /a   // node 402

        # 0 org

        entry f5b/main



        +cy


        : f5b/sec ( x - x )
          // force carry = 1
          dup dup xor inv dup . + drop
        ;



        : f5b/dbl ( RL DH RH - RL' DH RH' )
          // signed 36-bit R <<= 1
          // preserve DH in the middle

          >r >r
          clc
          dup . +
          r> r>
          dup . +
        ;



        : f5b/addd ( RL DH RH - RL' DH RH' )
          // R += D
          // DL is in A

          >r >r

          clc
          a . +

          r> r>
          over . +
        ;



        : f5b/subd ( RL DH RH - RL' DH RH' )
          // R -= D
          // DL is in A

          >r >r

          f5b/sec
          a inv . +

          r> r>
          over inv . +
        ;



        : f5b/q0 ( QL QH - QL' QH' )
          // Q <<= 1

          >r
          clc
          dup . +
          r>
          dup . +
        ;



        : f5b/q1 ( QL QH - QL' QH' )
          // Q = (Q << 1) | 1

          >r
          f5b/sec
          dup . +
          r>
          dup . +
        ;



        : f5b/div ( H1 H2 - H L )
          @b @b
          ( H1 H2 L1 L2 )

          // Arrange the input for the old division core.
          //
          // desired:
          //
          //   ... L1 H2 H1
          //       RL DH RH
          //
          //   A = L2 = DL
          //
          // stale H1 H2 below the working values are harmless.

          >r
          a!
          over >r
          a
          over
          r> r>
          a!

          ( ... L1 H2 H1 )     // A=L2

          // Initial non-restoring remainder:
          //
          // R = M1 - M2

          f5b/subd
          ( ... RL DH RH )

          // quotient starts at zero

          0 0
          ( ... RL DH RH QL QH )

          // integer bit + 26 fractional bits

          26. >r
          begin

            >r >r
            ( ... RL DH RH / QH QL )

            // remember sign of R before doubling

            dup >r

            f5b/dbl

            r> -if
              drop

              // old R was negative:
              // doubled R += D
              // quotient bit = 0

              f5b/addd

              r> r>
              f5b/q0

            else
              drop

              // old R was non-negative:
              // doubled R -= D
              // quotient bit = 1

              f5b/subd

              r> r>
              f5b/q1

            then

          unext

          // division core leaves:
          //
          //   ... QL QH
          //
          // f5b/pass expects H L.
          // Since stale stack entries are allowed, over is
          // the cheapest way to expose QH QL on top.

          over
        -cy


        : f5b/pass ( H L - )
          left a!
          over ! !
        ;




        : f5b/main
          @b
          @b
          ( H L )       // non-division
          ( H1 H2 )     // division
          --l-
          f5b/main
        ;
