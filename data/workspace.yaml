    - coordinate: 102
      enabled: true
      sourceCode: >-
        ( CVM2 node 102. VM 32 bit floatingpoint special step 4.
          handle special cases for MUL/DIV

        this is a slave node to node 104 via node 103.


        input after remote call:

          T t1 t2 s1 s2 e1 e2 h1 h2 l1 l2

        output:

          s e h l

        register A is free to use.


        type:
          0 = finite nonzero
          1 = zero
          2 = infinity
          4 = qNaN
          c = sNaN

        )


        # right /b

        # r--- /p



        // Read T,t1,t2,s1,s2.

        //

        // result:

        //   t1 t2 T

        //

        // A = s1 xor s2

        //

        // remaining input:

        //   e1 e2 h1 h2 l1 l2


        : fs4/head
          @b >r
          @b @b
          @b @b xor a!
          r>
        ;



        // discard e1 e2 h1 h2 l1 l2


        : fs4/drop6
          5 for @b drop unext
        ;



        // signed zero


        : fs4/zero
          fs4/drop6
          a !b
          a dup xor
          dup !b dup !b !b
        ;



        // signed infinity


        : fs4/inf
          fs4/drop6
          a !b
          0xff !b
          a dup xor
          dup !b !b
        ;



        // canonical qNaN = qNaN sentinel S=1


        : fs4/qnan
          fs4/drop6
          1 !b !b !b !b
        ;



        // ------------------------------------------------------------

        // MUL

        //

        // NaN           -> qNaN

        // zero * inf    -> qNaN

        // infinity      -> signed infinity

        // otherwise     -> signed zero

        //

        // With NaNs removed:

        //

        //   T = 1   zero involved

        //   T = 2   infinity involved

        //   T = 3   zero and infinity involved

        // ------------------------------------------------------------


        : fs4/mul
          fs4/head
          ( t1 t2 T )

          dup 4 and
          if
            drop drop
            fs4/qnan ;
          then
          drop

          dup 3 xor
          if
            drop

            2 and
            if
              drop
              fs4/inf ;
            then

            drop
            fs4/zero ;
          then

          drop drop
          fs4/qnan
        ;



        // ------------------------------------------------------------

        // DIV

        //

        // NaN       -> qNaN

        // 0 / 0     -> qNaN

        // inf / inf -> qNaN

        //

        // otherwise:

        //

        // result infinity iff:

        //

        //   numerator is infinity

        //        OR

        //   denominator is zero

        //

        // This is:

        //

        //   (t1 & 2) OR (t2 & 1)

        //

        // The two terms use different bits, therefore XOR can be used.

        // ------------------------------------------------------------


        : fs4/div
          fs4/head
          ( t1 t2 T )

          dup 4 and
          if
            drop drop
            fs4/qnan ;
          then
          drop drop
          ( t1 t2 )

          // Equal non-NaN special types can only be
          // 0/0 or inf/inf.

          over over xor
          . if
            drop

            // infinity result =
            // (t1 & 2) | (t2 & 1)

            1 and >r
            2 and
            r> xor

            if
              drop
              fs4/inf ;
            then

            drop
            fs4/zero ;
          then

          drop
          fs4/qnan
        ;
