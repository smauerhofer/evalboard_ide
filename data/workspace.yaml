        ;



        : fp4b/eff2 ( E1 E2 - E1' E2' )
          >r
          fp4b/eff
          r>
          fp4b/eff
        ;



        : fp4b/adjust ( E1 E2 - E )
          // invariant: E1 >= E2

          over over xor
          if
            drop

            // divide mantissa2 by 2
            A[ fp5b/shr2 ]] lit !

            // compensate by raising exponent2
            1 . +

