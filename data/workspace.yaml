        ( CVM2 node 304. VM 32 bit floatingpoint step x node. pack data


        this node reads sign exponent and mantissa and converts it into a 32-bit IEEE 754 number


        the data can also come from node 204, this is a shortcut for special values


        effective exponent:
          normal      raw exponent
          subnormal   1
          zero        0
          inf/nan     0xff

          in:  s e h l  {from node 404 or node 204}
          out: h l      {to node 305}

        )


        entry fx/main

        # -d-u /b

        # right /a


        # 0 org


        : fx/main
          @b >r                    // sign used at the end
          @b
          ( e / s )

          dup 0xff xor .
          if                       // finite
            drop
            @b
            ( e h / s )

            // no explicit hidden bit means zero/subnormal:
            // packed exponent must be zero

            dup 0x80 and
            if                     // normal
              drop
            else                   // zero or subnormal
              drop
              >r dup xor r>
            then

          else                     // infinity or NaN
            drop
            @b
            ( ff h / s )
          then

          ( e h / s )
          // pack
          >r
          2* 2* 2* 2* 2* 2* 2*
          r> 0x7f and
          xor
          ( h / s )

          r> xor                   // add sign
          ( h )
          !                        // h
          @b !                     // l
          fx/main
        ;
