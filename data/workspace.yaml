      sourceCode: >-
        ( CVM2 node 303. VM 32 bit floatingpoint step 3a.


        this node is a master of node 302.


        operation selection, operand ordering and sign processing.

          in: s1 s2         {from node 203}
        optional:
          in: c             {from node 203}

          out: s            {to node 403}

          c: magnitude compare result
            0x8000  : |f1| >  |f2|
            0       : |f1| == |f2|
            0x20000 : |f1| <  |f2|
        )


        # 302 import


        # down /a

        # right /b

        entry f3a/main


        # 0 org



        // select and forward original operand 1


        : f3a/first ( s1 s2 - s1 )
          A[ f4a/first ; ]] lit !b
          drop
        ;



        // select and forward original operand 2


        : f3a/second ( s1 s2 - s2 )
          A[ f4a/second ; ]] lit !b
          >r drop r>
        ;



        // select operand 2 iff c == code,

        // otherwise select operand 1.

        //

        // equality of magnitudes may therefore be assigned

        // to operand 1 by choosing code 8000 or 20000.


        : f3a/smaler @ 0x8000

        : f3a/select ( s1 s2 c code - s )
          xor
          if
            drop f3a/first ;
          then
          drop f3a/second
        ;

        : f3a/larger @ 0x20000 f3a/select ;





        // ADD and SUB

        //

        // SUB has already been converted to ADD semantics by

        // node 203 by flipping s2.

        //

        // same signs:

        //   c=8000  -> iadd, sign s1

        //   c=0000  -> iadd, sign s1

        //   c=20000 -> sadd, sign s1 (=s2)

        //

        // different signs:

        //   c=8000  -> isub, sign s1

        //   c=0000  -> isub, sign +0

        //   c=20000 -> ssub, sign s2


        : f3a/add ( s1 s2 - s )
          over over xor
          if
            // different signs
            drop
            @

            // 20000 is negative as an 18-bit F18 value
            -if
              drop
              A[ f4a/ssub ; ]] lit !b
              >r drop r>
              ;
            then

            // c is now either 8000 or 0.
            // Both use original orientation.
            >r
            A[ f4a/isub ; ]] lit !b
            drop
            r>

            // nonzero c -> operand 1 supplied the sign
            if
              drop ;
            then

            // exact cancellation
            dup xor
            ;
          then

          // same signs
          drop
          @

          // only c=20000 requires swapped orientation
          . -if
            drop
            A[ f4a/sadd ; ]] lit !b
            drop
            ;
          then

          drop
          A[ f4a/iadd ; ]] lit !b
          drop
        ;



        // MIN

        //

        // opposite signs:

        //   negative operand wins; c is ignored.

        //

        // same positive signs:

        //   smaller magnitude wins.

        //   operand 2 only when c=8000.

        //

        // same negative signs:

        //   larger magnitude wins.

        //   operand 2 only when c=20000.


        : f3a/min ( s1 s2 - s )
          over over xor
          if
            // opposite signs
            drop
            @ drop

            // s2 negative -> operand 2
            if
              f3a/second ;
            then

            // s2 positive -> operand 1
            f3a/first ;
          then

          // same signs
          drop
          over

          // both negative: larger magnitude
          . if
            drop
            f3a/larger ;
          then

          // both positive: smaller magnitude
          drop
          f3a/smaler
        ;



        // MAX

        //

        // opposite signs:

        //   positive operand wins; c is ignored.

        //

        // same positive signs:

        //   larger magnitude wins.

        //   operand 2 only when c=20000.

        //

        // same negative signs:

        //   smaller magnitude wins.

        //   operand 2 only when c=8000.


        : f3a/max ( s1 s2 - s )
          over over xor
          if
            // opposite signs
            drop
            @ drop

            // s2 negative -> operand 1
            if
              f3a/first ;
            then

            // s2 positive -> operand 2
            f3a/second ;
          then

          // same signs
          drop
          over

          // both negative: smaller magnitude
          if
            drop
            f3a/smaler ;
          then

          // both positive: larger magnitude
          drop
          f3a/larger
        ;



        // MUL and DIV don't receive c.

        // Node 302 combined entries perform f4a/in themselves.


        : f3a/mul ( s1 s2 - s )
          A[ f4a/imul ; ]] lit !b
          xor
        ;


        : f3a/div ( s1 s2 - s )
          A[ f4a/idiv ; ]] lit !b
          xor
        ;



        : f3a/main
          down a!
          @
          @
          ( s1 s2 )
          --l-
          ( s )
          up a!
          !
          f3a/main
        ;
