          @b                         // f
          down b!
          // send op + 2 parameter
          ( o g f )
          dup a!                     // set f
          >r >r !b                   // o
          @+ !b @+ !b                 // lh
          r> a!                      // set g
          @+ !b @+ !b                 // lh
          // receive result
          right b!
          r> a!                      // set f
          @b
          @b
          !+
          !+                         // hl
          left b!
        ;


