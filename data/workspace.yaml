        # 0 org


        : f5a/up ( - ) up a! ;



        : f5a/shr2 ( H1 H2 L1 L2 - H1 H2' L1 L2' ) // used to align exponent for addition
          a!                    // A = L2
          >r                    // save L1
          0 over                // H1 H2 0 H2
          . +*                  // S=0, T:A = H2:L2 >> 1
          >r drop drop          // save H2', remove 0 and old H2
          r> r> a               // H1 H2' L1 L2'
        ;


        : f5a/m9 ( h l - H L ) // 18x18 multiplication
          a! 17. >r
          dup dup xor
          begin . +* unext
          >r drop r> a
        ;



        +cy


        : f5a/add ( H1 H2 L1 L2 - H L ) // add mantissa
          clc                 // carry = 0

          . + >r              // L = L1+L2, carry-out retained
                              // H1 H2 / L

          . +                 // H = H1+H2+carry
                              // H / L

          r>                  // H L
        ;


        : f5a/sub ( H1 H2 L1 L2 - H L ) // subtract mantissa

          // force carry = 1
          dup dup xor inv dup . + drop

          // L = L1 - L2
          inv . + >r

          // H = H1 - H2 - borrow
          inv . +
          r>
        ;


