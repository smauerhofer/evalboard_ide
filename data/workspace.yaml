    debuggerAssemblyCode: 
    debuggerPrograms:
    - name: default
      source: >
        nop               ; cold-start fetch; no side effect

        nop

        nop

        pushlit 0x0100    ; push literal 0x0100 onto S (native stack, NOT external memory)

        pop               ; treats 0x0100 as the external stack pointer p; READs page1:0100 (fresh SRAM=0) into r

        push              ; writes r (0) back out; WRITE page1:0100 <- 0000

        lit 100           ; r = 0x0064

        push              ; WRITE <- 0064

        lit -1            ; r = 0xFFFF (lit's negative range)

        push              ; WRITE <- FFFF

        lit 511           ; r = 0x01FF (lit's positive extreme -- narrower than the retired slit's old 12-bit range)

        push              ; WRITE <- 01FF

        lit -512          ; r = 0xFE00 (lit's negative extreme -- narrower than the retired slit's old 12-bit range)

        push              ; WRITE <- FE00

        lit 15            ; r = 0x000F

        inv               ; r = ~0x000F = 0xFFF0

        push              ; WRITE <- FFF0

        lit 41            ; r = 0x0029

        inc               ; r = 0x002A

        push              ; WRITE <- 002A

        lit 41            ; r = 0x0029

        dec               ; r = 0x0028

        push              ; WRITE <- 0028

        lit 0x0012        ; X=0x0012 (shiftee)

        push              ; WRITE <- 0012

        lit 8             ; Y=8 (shift count, becomes r) -- node 507's 'for'/'next' loop runs (r+1) times, the standard F18 for-loop off-by-one, so this actually shifts by 9, not 8

        usl               ; pop X(0012) READ <- 0012; r = 0012<<(8+1) = 2400

        push              ; WRITE <- 2400

        lit -100          ; X=0xFF9C

        push              ; WRITE <- FF9C

        lit 3             ; Y=3 (count) -- actually shifts by (3+1)=4, same 'for'/'next' off-by-one as usl above

        ssr               ; pop X(FF9C) READ <- FF9C; r = signed(FF9C)>>(3+1) = FFF9

        push              ; WRITE <- FFF9

        lit -100          ; X=0xFF9C

        push              ; WRITE <- FF9C

        lit 3             ; Y=3 (count) -- actually shifts by (3+1)=4, same 'for'/'next' off-by-one as usl above

        usr               ; pop X(FF9C) READ <- FF9C; r = unsigned(FF9C)>>(3+1) = 0FF9

        push              ; WRITE <- 0FF9

        lit 100           ; X=100

        push              ; WRITE <- 0064

        lit 200           ; Y=200

        add               ; pop X(0064) READ <- 0064; r = 0064+00C8 = 012C

        push              ; WRITE <- 012C

        lit 500           ; X=500

        push              ; WRITE <- 01F4

        lit 200           ; Y=200

        sub               ; pop X(01F4) READ <- 01F4; r = X-Y = 01F4-00C8 = 012C

        push              ; WRITE <- 012C

        lit 0x0FF         ; X=0x0FF

        push              ; WRITE <- 00FF

        lit 0x0F0         ; Y=0x0F0

        and               ; pop X(00FF) READ <- 00FF; r = 00FF & 00F0 = 00F0

        push              ; WRITE <- 00F0

        lit 0x0FF         ; X=0x0FF

        push              ; WRITE <- 00FF

        lit 0x0F0         ; Y=0x0F0

        xor               ; pop X(00FF) READ <- 00FF; r = 00FF ^ 00F0 = 000F

        push              ; WRITE <- 000F

        lit 0x00F         ; X=0x00F

        push              ; WRITE <- 000F

        lit 0x0F0         ; Y=0x0F0

        or                ; pop X(000F) READ <- 000F; r = 000F | 00F0 = 00FF

        push              ; WRITE <- 00FF

        ; node 506's register-d block (zext/addc/ldd/std/xd/mul2d/div2d/sext/umuld) and node 407's

        ; register-w/port block (xpt/sthi/ldlo/stlo/ldhi) were REMOVED here 2026-09-09 as part of the

        ; CVM1-opcode cleanup -- eight of the nine register-d mnemonics and all five register-w/port

        ; mnemonics no longer assemble at all (no live CVM2 node backs them), and addc's own test

        ; (which validated node 506's now-retired addc, not addc's current home on node 510) is omitted

        ; rather than replaced with a fabricated, unverified expected value -- see this class's own

        ; remarks for the full explanation. Removing these lines shifted the frame-pointer subroutine's

        ; word address from 141 (0x8D) to 73 (0x49); the 'call below was updated to match.

        call 73           ; jump to the frame-pointer subroutine near the end of this program -- its own word address, computed by counting words (pushlit is the only 2-word instruction here); 73 (0x49)

        nop               ; execution resumes here once FRAME_TEST's own 'ret' returns

        nop

        nop

        br 1              ; EXPLORATORY -- Node607.f18 has no real branch decode for this tag yet; observe, don't assume, what the log shows

        nop

        cbr 1            ; EXPLORATORY -- same caveat as br above. This is the last instruction the main flow was ever designed to reach

        nop

        halt              ; stop the CPU cleanly here -- everything the main flow cares about has now been observed. Node 606's own 'halt (Stefan's addition: "wait for a word that will never come") parks execution in a blocking @b that never returns, so unlike every earlier revision of this program, control never falls through into FRAME_TEST's body a second time -- only a chip reset can move it now

        enter 4           ; reserve a 4-word frame; WRITE (old f, expected 0000) at the address 'leave' will read back; new f := that write address

        lit 0x0AB         ; r=0x00AB

        stl 1             ; WRITE r(00AB) to local #1 (frame-relative offset 1)

        lit 0x0CD         ; r=0x00CD

        stp 2             ; WRITE r(00CD) to parameter #2 (frame-relative offset 2)

        ldl 1             ; READ local #1 back into r -- expect the SAME address and value 00AB as the stl above

        push              ; WRITE <- 00AB (round-trips ldl's own fetch)

        ldp 2             ; READ parameter #2 back into r -- expect the SAME address and value 00CD as the stp above

        push              ; WRITE <- 00CD (round-trips ldp's own fetch)

        ; lal/lap RETIRED 2026-09-09 -- no longer assemble at all. The self-check that used to live here

        ; (comparing lal's/lap's freshly computed addresses against the stl/ldl and stp/ldp transactions

        ; above) is omitted rather than replaced with an unverified 'pushf-based guess -- see this class's

        ; own remarks for why.

        leave             ; READ back the frame's saved old f -- expect value 0000, restoring f to its pre-enter value

        ret               ; pop the return address 'call FRAME_TEST' pushed and resume the main flow. This is the intended, correct 'call'/'ret' round trip -- it lands back on the padding nop right after 'call' above, which then runs br/cbr and reaches 'halt, stopping the CPU cleanly instead of falling through into THIS SAME block a second time the way every earlier revision of this program did (see the header remarks)
