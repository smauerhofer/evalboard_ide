      sourceCode: >
        ( CVM2 node 601. VM 32 bit floatingpoint stage 5c node. implement divide )

        (
          calculates result for divide.

          always receives 4 words from node 501:

            add: L H x x
            sub: L H x x
            mul: L H 0 x
            div: L2 L1 H2 H1

          out: HL      {to node 602}
        )


        entry fp5c/main

        # up /b

        # left /a


        # 0 org



        +cy


        : fp5c/sec ( x-x )
          // force carry = 1
          dup dup xor inv dup . + drop
        ;



        : fp5c/dbl ( RL DH RH - RL' DH RH' )
          // signed 36-bit R <<= 1
          // preserve DH in the middle
          >r >r
          clc
          dup . +             // RL <<= 1
          r> r>
          dup . +             // RH = RH*2 + carry
        ;



        : fp5c/addd ( RL DH RH - RL' DH RH' )
          // R += D
          // DL is held in A

          >r >r               // RL / RH DH

          clc
          a . +               // RL += DL

          r> r>               // RL' DH RH
          over . +            // RH += DH + carry
        ;



        : fp5c/subd ( RL DH RH - RL' DH RH' )
          // R -= D
          // DL is held in A

          >r >r               // RL / RH DH

          fp5c/sec
          a inv . +           // RL -= DL

          r> r>               // RL' DH RH
          over inv . +        // RH -= DH + borrow
