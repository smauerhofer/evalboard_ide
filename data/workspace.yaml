      sourceCode: >
        ( CVM2 node 707. SRAM communication between nodes 607 and 708 )

        # 708 import

        # 0 org

        # down /b

        # left /a

        entry main

        : main
          @b
          // we hase something to do
          -if
            @b -if
              // ( ~p ~a )  write word
              A[ /wr ; ]] lit !
              >r ! r> ! @b ! main ;
            then
            // ( ~n p ) compare and exchange
            A[ /cx ; ]] lit !
            >r ! r> ! @b ! @b ! @ !b main ;
          then
          // ( p a ) read word
          A[ /rd ; ]] lit !
          ! @b ! @ !b 
          main ;
