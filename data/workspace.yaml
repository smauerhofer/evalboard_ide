          // Shift until E reaches 1, then encode E as 0.

          fp3c/shr

          >r >r                 // E / L H

          -if                   // E < 0
            r> r>
            fp3c/subnormal ;
          then

          if                    // E > 0; must be E=1
            drop
            0
            r> r>
            ;
          then

          // E=0
          r> r>
          fp3c/subnormal ;
        ;



        : fp3c/norm ( E H L - E' H' L' )
          >r >r                 // E / L H

          -if                   // E < 0
            r> r>
            fp3c/subnormal ;
          then

          if                    // E > 0
            r> r>
            ;
          then

          // E=0
          r> r>
          fp3c/subnormal ;
        ;



        // ADD/SUB:

        // bit15 = s1

        // bit14 = effective s1 xor s2


        : fp3c/add
          over xor 2/ xor !b
          A[ fp4c/add ; ]] lit !
        ;


