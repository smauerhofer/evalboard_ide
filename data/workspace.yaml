          // z2 = H1*H2
          // ------------------------------------------------

          >r >r                     // save L2,L1
          over over f5a/m9          // H1 H2 0 z2
          drop drop                 // A still contains z2
          r> r>                     // restore L1,L2

          a >r                      // / z2 z0


          // ------------------------------------------------
          // reorder
          //
          // H1 H2 L1 L2
          // -> H1 L2 H2 L1
          // ------------------------------------------------

          a! >r a r>                // swap L1,L2
          >r
          a! >r a r>                // swap H2,L2
          r>


          // ------------------------------------------------
