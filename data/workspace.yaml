        # left /b

        # up /a


        : fpf/inc 1 . + ;

        : fpf/dec -1 . + ;


        : fpf/normalize ( ehl/s-)


        : fpf/main
          @b >r
          @b if // NaN or infinite
            @b 0xff and 2* 2* 2* 2* 2* 2* 2*
            @b 0x7f and xor r> xor !
            @b 0xffff and ! fpf/main ;
          then // normal number
            // get exponent
            @b 0xff and >r
            @b // high mantissa
            // check if zero
            if // nonzero
              @b // low mantissa
            then
            @b // low mantissa
            // check if zero
            if // nonzero
              fpf/normalize ;
            then // zero
            >r !
            dup xor ! ;
