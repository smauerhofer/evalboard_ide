    - coordinate: 301
      enabled: true
      sourceCode: >+
        ( CVM2 node 301. VM 32 bit floatingpoint stage 5 node. prepare mantissa stream )

        (
          extend the mantissa from 24 bit to 27 bit

          input mantissa:
              h = 8 significant bits
              l = 16 significant bits

          output mantissa:
              H = 9 significant bits
              L = 18 significant bits

          Three zero bits are appended for guard/round/sticky processing.

          in: hhll        {from node 302}
          out: HHLL       {to node 401}
        )


        entry fp5/main

        # up /a

        # left /b


        # 0 org


        : fp5/extend ( h l-h' l')
          dup 0x8000 and
          if
            drop
            >r 2* 1 xor r> ..
          else
            drop
            >r 2* r>
          then
          2* 2* 2*
        ;


        : fp5/main
          @b            // h1
          @b            // h2
          ( h1 h2 )
          >r
          ( h1 / h2 )
          @b            // h1 l1
          ( h1 l1 / h2 )
          fp5/extend
          ( H1 L1 / h2 )
          >r ! r>       // output H1
          ( L1 / h2 )
          r> @b
          ( L1 h2 l2 )
          fp5/extend
          ( L1 H2 L2 )
          >r ! // output H2
          ( L1 / L2 )
          ! // output L1
          r> !  // output L2
          fp5/main
        ;

