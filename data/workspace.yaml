          // z0 = high18(L1*L2), unsigned 18x18
          // ------------------------------------------------

          over over

          dup >r a!
          17. >r
          dup dup xor
          begin . +* unext

          // If L1 has bit17 set, +* interpreted it as negative.
          // unsigned product therefore needs +L2 in high word.

