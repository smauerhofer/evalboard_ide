        ( CVM2 node 603. VM 32 bit floatingpoint stage 3c node. sign and normalization )

        (
          calculates final result sign.
          controls division path.
          completes subnormal result normalization.

          in:  ottss      {from node 503}
          in:  ehl        {from node 602}
          out: ottsehl    {to node 604}

          ADD/SUB sign:
            bit15 = final sign
            bit14 = effective s1 xor s2
        )


        # 602 import


        entry fp3c/main

        # up /a

        # left /b


        # 8 org



        : fp3c/shr ( E H L - E' H' L' )
          // E++, H:L >>= 1

          a!                    // A=L
          >r                    // / H

          1 . +                 // E++

          r>                    // E' H
          0 over
          . +*                  // H:A >>= 1

          >r drop drop
          r> a                  // E' H' L'
        ;



        : fp3c/subnormal ( E H L - 0 H' L' )
          // Called with E <= 0.
          // Shift until E reaches 1, then encode E as 0.

          fp3c/shr

          >r >r                 // E / L H

          -if                   // E < 0
            r> r>
            fp3c/subnormal ;
          then

          if                    // E > 0; must be E=1
            drop
            0
            r> r>
            ;
          then

          // E=0
          r> r>
          fp3c/subnormal ;
        ;



        : fp3c/norm ( E H L - E' H' L' )
          >r >r                 // E / L H

          -if                   // E < 0
            r> r>
            fp3c/subnormal ;
          then

          if                    // E > 0
            r> r>
            ;
          then

          // E=0
          r> r>
          fp3c/subnormal ;
        ;



        // ADD/SUB:

        // bit15 = s1

        // bit14 = effective s1 xor s2


        : fp3c/add
          over xor 2/ xor !b
          A[ fp4c/add ; ]] lit !
        ;


        : fp3c/sub
          over xor 2/ xor !b
          A[ fp4c/sub ; ]] lit !
        ;



        // MIN/MAX/NOP/SWAP:

        // 403 already selected/reordered the desired operand,

        // so final sign is s1.


        : fp3c/pass
          drop !b
          A[ fp4c/pass ; ]] lit !
        ;



        // MUL/DIV:

        // final sign = s1 xor s2


        : fp3c/mul
          xor !b
          A[ fp4c/mul ; ]] lit !
        ;


        : fp3c/div
          xor !b
          A[ fp4c/div ; ]] lit !
        ;



        : fp3c/main
          up a!

          @ dup !b >r           // o
          @ !b                  // t1
          @ !b                  // t2
          @                     // s1
          @                     // s2

          ex                    // sends final sign and controls 602

          right a!

          @                     // e
          @                     // h
          @                     // l

          fp3c/norm

          // B still points to output node 604.
          // fp3c/norm may have destroyed A, but that does not matter.

          >r >r
          !b                    // e
          r> !b                 // h
          r> !b                 // l

          fp3c/main
        ;



        # 0 org


        fp3c/add ;

        fp3c/sub ;

        fp3c/pass ;             // min

        fp3c/pass ;             // max

        fp3c/mul ;

        fp3c/div ;

        fp3c/pass ;             // nop

        fp3c/pass ;             // swap
