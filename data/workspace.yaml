        ( CVM2 node 502. VM 32 bit floatingpoint stage 4b node. exponent arithmetic )

        (
          calculates result exponent for add/multiply.
          passes both exponents for division.

          in: EE        {from node 402}

          out: always 2 words to node 602

            add: E E       {second E may be ignored}
            sub: E E
            mul: ...
            div: E2 E1     {native ! ! transmission order}
        )


        # 501 import


        entry fp4b/main

        # down /b

        # up /a


        # 0 org


        : fp4b/eff ( e-e' )
          if ; then
          drop 1 ;


        : fp4b/adjust ( E1 E2 - E E )
          // invariant: E1 >= E2

          over over xor
          if
            drop

            // divide mantissa2 by 2
            A[ fp5b/shr2 ]] lit !

            // compensate by raising exponent2
            1 . +

            fp4b/adjust ;
          then
          drop     // compare result
          drop     // discard E2, leave E1
        ;



        : fp4b/add ( E1 E2-E E )
          fp4b/adjust
          A[ fp5b/add ; ]] lit !
        ;


        : fp4b/sub ( E1 E2-E E )
          fp4b/adjust
          A[ fp5b/sub ; ]] lit !
        ;


        : fp4b/mul ( E1 E2 - E )
          +
          0x7e inv . +            // E1'+E2'-127

          A[ fp5b/mul ; ]] lit !
        ;


        : fp4b/div ( E1 E2 - E )
          inv . +                 // E1'-E2'-1
          0x80 . +                // +128 => E1'-E2'+127

          A[ ; ]] lit !           // 501 passes operands through
        ;



        : fp4b/main
          @b fp4b/eff               // E1: 0 -> 1
          @b fp4b/eff               // E2: 0 -> 1
          ( E1 E2 )

          r---

          ( E )
          !                         // one exponent to node 602

          fp4b/main
        ;
