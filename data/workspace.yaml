        : fp3a/send ( t1 t2 s1 s2 - )
          down a!
          >r >r >r
          !           // t1
          r> !        // t2
          r> !        // s1
          r> !        // s2
        ;


        : fp3a/mul ( t1 t2 s1 s2 )
