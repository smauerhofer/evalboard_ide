        entry right


        # 0 org


        +cy


        : f4c/shl ( e h - e' h' ) // A=l -> A=l'
          // normalize one position to the left:
          //
          // H:L <<= 1
          // e--

          clc

          a dup . + a!         // L <<= 1, retain carry

          dup . +              // H = H*2 + carry

          // f4c/shl is only called with H < 0x100.
          // Therefore the H addition cannot carry out,
          // so exponent decrement is safe in EAM.

          >r
          -1 . +
          r>
        ;


        -cy



        : f4c/shr ( e h - e' h' ) // A=l -> A=l'
          // H:L >>= 1
          // e++
          //
          // Same 36-bit shift mechanism as f5a/shr2.
          // S=0, T=H, A=L.
          //
          // H is positive here, therefore the arithmetic
          // right shift performed by +* is appropriate.

          0 over
          . +*                  // T:A = H:L >> 1

          >r
          drop drop             // remove 0 and old H

          1 . +                 // e++

          r>
        ;



        : f4c/adjust ( e h - e' h' ) // A=l -> A=l'
          // Normalize H:L so H bit 8 is the hidden bit.
          //
          //   H & 0x200 != 0   shift right once, e++
          //   H & 0x100 != 0   normalized
          //   otherwise        shift left, e--
          //
          // Zero produces e=0, H=0, L=0.

          if
            // H != 0

            // H bit 9:
            // result is in [2,4)

            dup 0x200 and
            if
              drop
              f4c/shr
              ;
            then
            drop

            // H bit 8:
            // result is in [1,2)

            dup 0x100 and
            if
              drop
              ;
            then
            drop

            // result is below 1

            ..
            f4c/shl
            f4c/adjust
            ;
          then

          // H == 0
          // Test L directly from A.

          a
          if
            drop
            ..
            f4c/shl
            f4c/adjust
            ;
          then

