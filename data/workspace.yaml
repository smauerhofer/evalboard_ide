      sourceCode: >-
        ( CVM2 node 201. VM 32 bit floatingpoint step 5.


        mantissa preparation.


        optional magnitude comparison

          in:  h1 h2 l1 l2  {from node 202}
          out: H1 H2 L1 L2  {to node 301}
        optional:
          out: c             {to node 202}

          c: magnitude compare result
            0x8000  : |f1| >  |f2|
            0       : |f1| == |f2|
            0x20000 : |f1| <  |f2|
        )


        # down /a

        # left /b

        entry f5/main


        # 0 org


        : f5/sub inv . +

        : f5/inc 1 . + ;


        : f5/gt ( diff - c )
          -if
            drop 0x20000 ;       // f1 < f2
          then
          if
            drop 0x8000 ;        // f1 > f2
          then
          // diff = 0 -> equal, leave 0
        ;


        : f5/extend ( h l - H L)
          dup 0x8000 and
          if
            drop
            >r 2* 1 xor r> ..
          else
            drop
            >r 2* r>
          then
          2* 2* 2*
        ;



        : f5/ignore // no compare calculation
          ( h1 h2 l1 l2 )
        ;



        : f5/calc ( h1 h2 l1 l2 - h1 h2 l1 l2 )
          // Compare high mantissa words first,
          // while preserving all four input words.

          >r >r
          ( h1 h2 / l2 l1 )

          over over f5/sub

          if
            f5/gt
            !b
            r> r>
            ;
          then

          drop

          // High words equal: compare low words.

          r> r>
          ( h1 h2 l1 l2 )

          over over f5/sub
          f5/gt
          !b
        ;



        : f5/main
          @b               // h1
          @b               // h2
          @b               // l1
          @b               // l2
          ( h1 h2 l1 l2 )

          // First allow node 202 to request either
          // f5/ignore or f5/calc.
          //
          // f5/calc preserves h1 h2 l1 l2.

          left a!
          --l-

          ( h1 h2 l1 l2 )

          // Rearrange into the two h,l pairs
          // required by f5/extend.

          >r
          ( h1 h2 l1 / l2 )

          a!
          ( h1 h2 / l2 )

          >r a
          ( h1 l1 / l2 h2 )

          f5/extend
          ( H1 L1 / l2 h2 )

          r> r>
          ( H1 L1 h2 l2 )

          f5/extend
          ( H1 L1 H2 L2 )

          down a!

          >r >r >r !       // H1
          r> r> !           // H2
          !                 // L1
          r> !              // L2

          f5/main
        ;
