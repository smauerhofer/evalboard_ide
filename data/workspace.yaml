    - coordinate: 402
      enabled: true
      sourceCode: >+
        ( CVM2 node 402. VM 32 bit floatingpoint step 4b.


        exponent finalization and division selection


        node 402 sends one of the following instructions:
         A[ f5b/div ; ]] for division
         A[ f5b/pass ; ]] for all other operations

        result passing and division.

          in: e            {exponent from node 302}
        alternative
          in: ediv         {flagged exponent from node 302}

          in: H L          {mantissa from node 401}

          out: e H L       {normalized result to node 403}

        )


        # 401 import


        # up /b           // node 302

        # left /a         // node 401

        entry f4b/main


        # 0 org


        +cy


        : f4b/shl ( e h l - e' h' l' )
          // normalize one position to the left:
          //
          // H:L <<= 1
          // e--

          clc
          dup . +             // L <<= 1
          >r
          dup . +             // H = H*2 + carry
          >r

          // H is below 0x100 whenever this word is called,
          // therefore the high-word addition cannot generate
          // a carry.  The exponent decrement is consequently
          // safe in extended arithmetic mode.

          -1 . +

          r> r>
        ;


        -cy



        : f4b/shr ( e h l - e' h' l' )
          // normalize one position to the right:
          //
          // H:L >>= 1
          // e++
          //
          // only needed for H bit 9 overflow.

          >r                  // e h / L

          // save H bit 0

          dup 2/ 2* xor
          >r                  // e h / L h0

          // H >>= 1

          2/
          >r                  // e / L h0 H'

          // e++

          1 . +

          r>                  // e' H'
          r>                  // e' H' h0
          r>                  // e' H' h0 L

          // logical L >>= 1.
          // 2/ is arithmetic, so clear its propagated sign bit.

          2/
          0x1ffff and
          >r                  // e' H' h0 / L'

          // old H bit 0 becomes new L bit 17

          . if
            drop
            r> 0x20000 xor
            ;
          then

          drop
          r>
        ;


        : f4b/adjust ( e h l - )
          // Normalize H:L so that H bit 8 is the hidden bit.
          //
          // Expected nonzero cases:
          //
          //   H & 200 != 0   shift right once, e++
          //   H & 100 != 0   already normalized
          //   otherwise      shift left, e--
          //
          // Zero is converted to exponent zero.

          over
          if
            // H != 0

            drop

            // one-bit overflow?

            over 0x200 and
            if
              drop
              f4b/shr
              ;
            then
            drop

            // normalized?

            over 0x100 and
            if
              drop
              ;
            then
            drop

            // H != 0 but hidden bit not reached yet

            f4b/shl
            f4b/norm
            ;
          then

          // H == 0

          drop

          dup
          . if
            // L != 0: continue left normalization

            drop
            f4b/shl
            f4b/norm
            ;
          then

          // H:L == 0.
          // Force exponent to zero.
          //
          // stale original e is harmless.

          drop
          >r >r
          dup xor
          r> r>
        ;



        : f4b/norm ( e h l - ) // normalize and send result
          a >r        // save a
          // adjust exponent
          ( e h l )
          f4b/adjust
          ( e h l )
          r> a!       // restore a
          // send
          >r >r !b    // e
          r> !b       // h
          r> !b       // l

        : f4b/main
          up b!
          @b 
          ( e )
          dup 2* xor
          . -if // exponent flagged for division
            A[ f5b/div ; ]] lit ! // invoke division in node 401
            drop
            0x20000 xor // recover exponent
          else // normal exponent
            A[ f5b/pass ; ]] lit ! // invoke pass values in node 401
            drop
          then
          ( e )
          @ @          // read result from node 401
          ( e h l )
          right b!
          // normalize
          f4b/norm
        ;

