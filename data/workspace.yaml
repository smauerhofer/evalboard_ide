        : f1/frac? ( l h - l h f )
          dup 0x7f and
          if
            ;
          then
          drop
          over
        ;



        // leaves l h intact and adds type


        : f1/type ( l h - l h t )

          dup
          2/ 2/ 2/ 2/ 2/ 2/ 2/
          0xff and

          // exponent != 0

          if
            0xff xor ..

            // exponent 1..254 -> finite nonzero

            if
              dup
              xor
              ;
            then

            // exponent == 0xff

            drop
            f1/frac?

            // fraction != 0 -> NaN

            if
              drop

              // fraction bit 22 is quiet bit

              dup 0x40 and
              if
                drop
                0x04
                ;
              then

              drop
              0x0c
              ;
            then

            // exponent ff, fraction zero -> infinity

            drop
            0x02
            ;
          then

          // exponent == 0

          drop
          f1/frac?

          // nonzero fraction -> subnormal finite

          if
            dup
            xor
            ;
          then

          // exponent zero, fraction zero -> zero

          drop
          0x01
