          over over                 // H1 H2 L1 L2 L1 L2

          dup >r a!                 // save L2, A=L2
          17. >r
          dup dup xor               // L1 L1 0
          begin . +* unext          // signed L1*unsigned L2

          // If L1 has bit17 set, +* interpreted it as negative.
          // unsigned product therefore needs +L2 in high word.

          over -if
            drop
            r> . +
          else
            drop
            r> drop
          then

