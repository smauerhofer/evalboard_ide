        ;



        : fp4b/sub ( E1 E2 - E )
          fp4b/eff2
          fp4b/adjust

          A[ fp5b/sub ; ]] lit !
        ;



        : fp4b/mul ( E1 E2 - E )
          fp4b/eff2

          +
          0x7e inv . +             // E1'+E2'-127

